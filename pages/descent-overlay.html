<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Descent - Premium Orthographic Overlay</title>
    
    <!-- Ultra Premium Fonts: Anton for heavy monolithic numbers, Teko for HUD labels, Rajdhani for technical text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">

    <style>

        :root {
            /* Deep Void Obsidian */
            --bg-void: rgba(8, 8, 12, 0.95);
            --bg-void-light: rgba(18, 16, 24, 0.98);
            
            /* Premium Neon Palette */
            --blood-core: #ff003c;
            --gold-core: #ffc800;
            --cyan-core: #00f0ff;
            --void-core: #9d00ff;
            --ash-gray: #b8b8cc;
            
            /* Typography */
            --font-ui: 'Teko', sans-serif;
            --font-num: 'Anton', sans-serif;
            --font-tech: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: transparent !important; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

 
        #overlay-container {
            position: absolute;
            top: 40px; right: 40px;
            display: flex; flex-direction: column; gap: 24px; 
            width: 440px; 
            z-index: 2;
        }


        .protocol-banner {
            background: linear-gradient(90deg, rgba(0,0,0,0.9), rgba(15,10,10,0.95));
            padding: 16px 25px;
            text-align: right;
            border-radius: 6px;
            border-right: 8px solid var(--blood-core);
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,0,60,0.1);
            position: relative;
            transform-origin: right center;
            animation: cinematicReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .protocol-label {
            font-family: var(--font-ui); font-size: 2.5rem; color: #fff;
            text-transform: uppercase; letter-spacing: 8px; line-height: 0.9;
            text-shadow: 0 4px 6px rgba(0,0,0,1), 0 0 15px var(--blood-core);
        }

        .protocol-sub {
            font-family: var(--font-tech); font-size: 1.15rem; color: var(--ash-gray);
            font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
            background: rgba(255,0,60,0.15); display: inline-block; padding: 4px 12px; margin-top: 6px;
            border: 1px solid rgba(255,0,60,0.3); border-radius: 3px;
        }

        .hardcore-pulse .protocol-sub { 
            color: #fff; background: var(--blood-core); border-color: #fff; 
            box-shadow: 0 0 20px var(--blood-core); animation: dangerFlash 1s infinite alternate; 
        }
        @keyframes dangerFlash { 0% { filter: brightness(1); } 100% { filter: brightness(1.5); box-shadow: 0 0 40px var(--blood-core); } }


        .monolith-wrapper {
            position: relative;
            /* The padding dictates the exact thickness of the border */
            padding: 4px; 
            border-radius: 8px;
            background: rgba(0,0,0,0.8);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            overflow: hidden; /* Clips the spinning gradient to the border radius */
            
            transform-origin: right center;
            opacity: 0;
            animation: cinematicReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateZ(0); /* Hardware acceleration */
        }

        /* The Spinning Light Beam */
        .border-spinner {
            position: absolute;
            top: 50%; left: 50%;
            width: 300%; height: 500%;
            /* Creates a beam of light matching the theme color */
            background: conic-gradient(from 0deg, transparent 70%, var(--theme-core) 90%, #ffffff 100%);
            transform-origin: center center;
            animation: spinBorder 4s linear infinite;
            z-index: 0;
        }
        @keyframes spinBorder {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* The Inner Glass Plate */
        .monolith-inner {
            position: relative;
            background: linear-gradient(145deg, var(--bg-void) 0%, var(--bg-void-light) 100%);
            border-radius: 5px;
            padding: 15px 35px; 
            display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
            z-index: 2;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        /* Subtle Inner Scanlines */
        .monolith-inner::after {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.02) 2px, rgba(255,255,255,0.02) 4px);
            pointer-events: none; z-index: 1;
        }

        /* Theme Mapping */
        #wrap-points { animation-delay: 0.1s; --theme-core: var(--blood-core); }
        #wrap-cleared { animation-delay: 0.2s; --theme-core: var(--gold-core); }
        #wrap-perks { animation-delay: 0.3s; --theme-core: var(--void-core); }
        #wrap-losses { animation-delay: 0.4s; --theme-core: var(--cyan-core); }

        @keyframes cinematicReveal {
            0% { transform: scaleX(0); filter: brightness(3); opacity: 0; }
            100% { transform: scaleX(1); filter: brightness(1); opacity: 1; }
        }


        .stat-label {
            font-family: var(--font-ui); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 5px;
            color: var(--ash-gray); margin-bottom: -5px; font-weight: 600; z-index: 4; position: relative;
            text-shadow: 0 4px 6px rgba(0,0,0,1);
        }

        .stat-value {
            /* Using Anton for thick, straight, monolithic numbers */
            font-family: var(--font-num); font-size: 5.5rem; line-height: 1.0; letter-spacing: 3px; 
            z-index: 4; position: relative;
            
            /* The Unbreakable Legibility Core */
            color: #ffffff;
            -webkit-text-stroke: 2px #000000;
            text-shadow: 
                0 0 20px var(--theme-core), 
                0 0 40px var(--theme-core), 
                6px 6px 0px #000000; /* Hard 3D block shadow */
                
            transform-origin: right center;
        }

        .stat-subtext {
            font-family: var(--font-tech); font-size: 1.25rem; letter-spacing: 4px; font-weight: 700;
            color: var(--theme-core); text-shadow: 0 3px 5px rgba(0,0,0,1); margin-top: 5px; z-index: 4; position: relative;
            background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05);
        }

        /* Losses use a muted theme */
        #wrap-losses .stat-value { color: #e0e0e0; text-shadow: 0 0 20px rgba(0,240,255,0.3), 6px 6px 0px #000000; }

   
        /* Applied via JS when a number changes */
        
        .update-flash {
            animation: containerBump 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes containerBump {
            0% { transform: scale(1); }
            30% { transform: scale(1.08) translateX(-15px); }
            100% { transform: scale(1) translateX(0); }
        }

        /* Hyperspeed border spin during update */
        .update-flash .border-spinner {
            background: conic-gradient(from 0deg, transparent 10%, var(--theme-core) 40%, #ffffff 100%);
            animation: spinBorder 0.4s linear infinite;
        }

        /* Inner glass flashes bright */
        .update-flash .monolith-inner {
            animation: glassFlash 0.8s ease-out forwards;
        }
        @keyframes glassFlash {
            0% { background: linear-gradient(145deg, var(--bg-void) 0%, var(--bg-void-light) 100%); }
            15% { background: var(--theme-core); box-shadow: inset 0 0 100px #fff; }
            100% { background: linear-gradient(145deg, var(--bg-void) 0%, var(--bg-void-light) 100%); }
        }

        /* Text violently decrypts and scales */
        .cipher-flash {
            animation: textDecipherSlam 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes textDecipherSlam {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.25); color: #fff; -webkit-text-stroke: 4px var(--theme-core); text-shadow: 0 0 100px #fff, 6px 6px 0px #000; }
            100% { transform: scale(1); color: #fff; -webkit-text-stroke: 2px #000; }
        }

    </style>
</head>
<body>

    <div id="overlay-container">
        
        <!-- Top Protocol Banner -->
        <div class="protocol-banner">
            <div class="protocol-label" id="tier-display">SYS_INIT</div>
            <div class="protocol-sub" id="mode-display">AWAITING CONNECTION</div>
        </div>

        <!-- 1. Total Points -->
        <div class="monolith-wrapper" id="wrap-points">
            <div class="border-spinner"></div>
            <div class="monolith-inner">
                <div class="stat-label">Bloodpoints Extracted</div>
                <div class="stat-value" id="val-points" data-val="0">0</div>
            </div>
        </div>

        <!-- 2. Killers Cleared -->
        <div class="monolith-wrapper" id="wrap-cleared">
            <div class="border-spinner"></div>
            <div class="monolith-inner">
                <div class="stat-label">Killers Cleansed</div>
                <div class="stat-value" id="val-cleared" data-val="0">0</div>
                <div class="stat-subtext" id="sub-cleared">ROSTER: SCANNING...</div>
            </div>
        </div>

        <!-- 3. Perks Sacrificed -->
        <div class="monolith-wrapper" id="wrap-perks">
            <div class="border-spinner"></div>
            <div class="monolith-inner">
                <div class="stat-label">Perks Shattered</div>
                <div class="stat-value" id="val-perks" data-val="0">0</div>
            </div>
        </div>

        <!-- 4. Total Losses -->
        <div class="monolith-wrapper" id="wrap-losses">
            <div class="border-spinner"></div>
            <div class="monolith-inner">
                <div class="stat-label">Total Defeats</div>
                <div class="stat-value" id="val-losses" data-val="0">0</div>
            </div>
        </div>

    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  
        const firebaseConfig = {
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const streamerUsername = urlParams.get('user');
        
        const modeDisplay = document.getElementById('mode-display');
        const tierDisplay = document.getElementById('tier-display');

        if (!streamerUsername) {
            tierDisplay.innerText = "ERROR_404";
            modeDisplay.innerText = "NO TARGET ASSIGNED";
            document.querySelector('.protocol-banner').classList.add('hardcore-pulse');
        } else {

            function hyperDecipherRoll(obj, start, end, duration) {
                let startTimestamp = null;
                // Using blocky, tech-focused characters
                const cyberChars = "01X%#8Z"; 
                
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    
                    if (progress < 0.6) {
                        // The "Scramble" Phase
                        let randomStr = "";
                        const len = end.toString().length;
                        for(let i = 0; i < len; i++) {
                            randomStr += cyberChars[Math.floor(Math.random() * cyberChars.length)];
                        }
                        obj.innerText = randomStr;
                    } else {
                        // The "Odometer Snap" Phase
                        const easeOut = 1 - Math.pow(1 - ((progress - 0.6) * 2.5), 4);
                        const current = Math.floor(start + (end - start) * easeOut);
                        obj.innerText = current.toLocaleString();
                    }
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        obj.innerText = end.toLocaleString();
                        obj.setAttribute('data-val', end);
                    }
                };
                window.requestAnimationFrame(step);
            }


            const previousState = { points: null, cleared: null, perks: null, losses: null };

            function triggerPremiumImpact(elementId, wrapId, newValue, stateKey) {
                const el = document.getElementById(elementId);
                const wrap = document.getElementById(wrapId);
                
                if (previousState[stateKey] !== newValue) {
                    const oldValue = previousState[stateKey] === null ? 0 : previousState[stateKey];
                    
                    // Reset Animations instantly via DOM reflow
                    el.classList.remove('cipher-flash');
                    wrap.classList.remove('update-flash');
                    void wrap.offsetWidth; 
                    
                    // Fire the violent shockwave and bright text slam
                    wrap.classList.add('update-flash');
                    el.classList.add('cipher-flash');
                    
                    // Roll numbers aggressively (800ms to match the CSS animation duration)
                    hyperDecipherRoll(el, oldValue, newValue, 800);
                    
                    previousState[stateKey] = newValue;
                }
            }


            const userRef = doc(db, 'player_state', streamerUsername);
            
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    
                    const data = docSnap.data();
                    
                    const points = data.points || 0;
                    const currentTier = data.currentTier || 0;
                    const completedArray = data.completed_killers || [];
                    const currentCleansed = completedArray.length;
                    
                    // Calculate true total cleared based on Tiers
                    const totalCleansed = (currentTier * 44) + currentCleansed;
                    
                    const stats = data.stats || {};
                    const sacrificed = stats.sacrificed || 0;
                    const losses = stats.losses || 0;
                    const mode = data.mode || 'normal';

                    // Update Top Banner
                    tierDisplay.innerText = `TIER ${currentTier}`;
                    if (mode === 'hardcore') {
                        modeDisplay.innerText = "HARDCORE PROTOCOL ACTIVE";
                        document.querySelector('.protocol-banner').classList.add('hardcore-pulse');
                    } else {
                        modeDisplay.innerText = "NORMAL PROTOCOL ACTIVE";
                        document.querySelector('.protocol-banner').classList.remove('hardcore-pulse');
                    }

                    document.getElementById('sub-cleared').innerText = `${currentCleansed} / 44 (TIER ${currentTier})`;

                    // Trigger High-End Animations
                    triggerPremiumImpact('val-points', 'wrap-points', points, 'points');
                    triggerPremiumImpact('val-cleared', 'wrap-cleared', totalCleansed, 'cleared');
                    triggerPremiumImpact('val-perks', 'wrap-perks', sacrificed, 'perks');
                    triggerPremiumImpact('val-losses', 'wrap-losses', losses, 'losses');

                } else {
                    modeDisplay.innerText = "AWAITING TARGET DATA...";
                }
            }, (error) => {
                tierDisplay.innerText = "ERROR_503";
                modeDisplay.innerText = "UPLINK SEVERED";
                document.querySelector('.protocol-banner').classList.add('hardcore-pulse');
            });
        }
    </script>
</body>
</html>
