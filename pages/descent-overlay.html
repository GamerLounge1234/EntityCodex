<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Descent - Killer Overlay</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">

    <style>
      
        :root {
            /* Deep Void Obsidian */
            --bg-void: rgba(12, 10, 15, 0.90);
            --bg-void-light: rgba(22, 18, 26, 0.95);
            
            /* Premium Neon Palette */
            --blood-core: #ff003c;
            --blood-dark: #7a001d;
            --blood-glow: rgba(255, 0, 60, 0.8);
            
            --gold-core: #ffc800;
            --gold-dark: #8a6c00;
            --gold-glow: rgba(255, 200, 0, 0.8);

            --cyan-core: #00f0ff;
            
            --ash-gray: #b8b8cc;
            
            /* Typography */
            --font-ui: 'Teko', sans-serif;
            --font-num: 'Anton', sans-serif;
            --font-tech: 'Rajdhani', sans-serif;
            
            /* Geometric Cuts - Mathematically adjusted for ultra-thick borders */
            --clip-monolith: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
            --clip-inner: polygon(23px 0, 100% 0, 100% calc(100% - 23px), calc(100% - 23px) 100%, 0 100%, 0 23px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: transparent !important; 
            overflow: hidden; 
            -webkit-font-smoothing: antialiased;
        }

     
        #overlay-container {
            position: absolute;
            top: 40px; right: 40px;
            display: flex; flex-direction: column; gap: 28px; /* Increased gap for huge glowing borders */
            width: 480px; 
            z-index: 2;
            padding-right: 18px;
            border-right: 4px solid rgba(255, 255, 255, 0.15);
        }

        /* Continuous Energy Flow along the spine */
        #overlay-container::after {
            content: ''; position: absolute; top: 0; right: -4px; width: 4px; height: 100%;
            background: linear-gradient(to bottom, transparent, var(--blood-core), #fff, var(--blood-core), transparent);
            background-size: 100% 300%;
            animation: spineFlow 2.5s infinite linear;
            box-shadow: 0 0 25px var(--blood-glow);
        }
        @keyframes spineFlow { 0% { background-position: 0% -100%; } 100% { background-position: 0% 200%; } }

     
        .protocol-banner {
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 25px;
            text-align: right;
            border-right: 8px solid var(--blood-core);
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,0,60,0.2);
            position: relative;
            
            /* Cinematic Reveal */
            transform-origin: right center;
            animation: cinematicReveal 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .protocol-label {
            font-family: var(--font-ui); font-size: 2.4rem; color: #fff;
            text-transform: uppercase; letter-spacing: 8px; line-height: 0.9;
            text-shadow: 0 4px 6px rgba(0,0,0,1), 0 0 15px var(--blood-core);
        }

        .protocol-sub {
            font-family: var(--font-tech); font-size: 1.15rem; color: var(--ash-gray);
            font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
            background: rgba(255,0,60,0.15); display: inline-block; padding: 3px 10px; margin-top: 5px;
            border: 1px solid rgba(255,0,60,0.3);
        }

        .hardcore-pulse .protocol-sub { color: #fff; background: var(--blood-core); border-color: #fff; box-shadow: 0 0 20px var(--blood-core); animation: dangerFlash 0.8s infinite alternate; }
        @keyframes dangerFlash { 0% { filter: brightness(1); } 100% { filter: brightness(1.6); box-shadow: 0 0 40px var(--blood-core); } }


        .monolith-wrapper {
            position: relative;
            padding: 8px; /* ULTRA THICK BORDER (Doubled from before) */
            
            /* The shifting energy liquid gradient */
            background: linear-gradient(60deg, var(--theme-dark) 0%, var(--theme-core) 30%, #ffffff 50%, var(--theme-core) 70%, var(--theme-dark) 100%);
            background-size: 300% 300%;
            
            clip-path: var(--clip-monolith);
            box-shadow: 0 25px 45px rgba(0,0,0,0.9);
            
            opacity: 1;
            
            /* High-Speed flowing energy animation */
            animation: 
                cinematicReveal 1s cubic-bezier(0.16, 1, 0.3, 1) backwards,
                hyperFluxFlow 2.5s infinite linear;
            
            transform-origin: right center;
        }

        /* Staggered load & Theme Mapping */
        #wrap-points { animation-delay: 0.1s, 0.1s; --theme-core: var(--blood-core); --theme-dark: var(--blood-dark); --theme-glow: var(--blood-glow); }
        #wrap-cleared { animation-delay: 0.2s, 0.2s; --theme-core: var(--gold-core); --theme-dark: var(--gold-dark); --theme-glow: var(--gold-glow); }
        #wrap-perks { animation-delay: 0.3s, 0.3s; --theme-core: var(--blood-core); --theme-dark: var(--blood-dark); --theme-glow: var(--blood-glow); }
        #wrap-losses { animation-delay: 0.4s, 0.4s; --theme-core: #666; --theme-dark: #222; --theme-glow: rgba(255,255,255,0.2); }

        @keyframes cinematicReveal {
            0% { transform: scaleX(0); filter: brightness(3); opacity: 0; }
            100% { transform: scaleX(1); filter: brightness(1); opacity: 1; }
        }

        /* The continuous shifting, pulsing border energy */
        @keyframes hyperFluxFlow {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 15px var(--theme-core)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 35px var(--theme-core)); }
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 15px var(--theme-core)); }
        }

        /* Inner Glass Plate */
        .monolith-block {
            position: relative;
            background: linear-gradient(145deg, var(--bg-void) 0%, var(--bg-void-light) 100%);
            clip-path: var(--clip-inner);
            padding: 16px 30px; 
            display: flex; flex-direction: column; justify-content: center; align-items: flex-end;
            z-index: 2;
            overflow: hidden; 
            /* Inner shadow to separate the black void from the bright energy border */
            box-shadow: inset 0 0 40px rgba(0,0,0,1);
        }

      
        .monolith-block::before {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px);
            background-size: 100% 200%;
            animation: scanlineRoll 10s linear infinite;
            pointer-events: none; z-index: 1;
        }
        @keyframes scanlineRoll { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }

        .monolith-block::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-25deg);
            z-index: 2;
            animation: glossSweep 5s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }
        @keyframes glossSweep { 0% { left: -100%; } 15% { left: 200%; } 100% { left: 200%; } }

       
        .stat-label {
            font-family: var(--font-ui); font-size: 1.9rem; text-transform: uppercase; letter-spacing: 5px;
            color: var(--ash-gray); margin-bottom: -15px; font-weight: 700; z-index: 4; position: relative;
            text-shadow: 0 4px 6px rgba(0,0,0,1);
        }

        .stat-value {
            font-family: var(--font-num); font-size: 6.2rem; line-height: 1.05; letter-spacing: 2px; 
            z-index: 4; position: relative;
            
            /* The Unbreakable Legibility Core */
            color: #ffffff;
            -webkit-text-stroke: 3px #000000;
            text-shadow: 
                0 0 25px var(--theme-core), 
                0 0 45px var(--theme-core), 
                0 8px 0px #000000, 
                0 15px 30px rgba(0,0,0,1);
                
            transform-origin: right center;
        }

        .stat-subtext {
            font-family: var(--font-tech); font-size: 1.3rem; letter-spacing: 4px; font-weight: 700;
            color: var(--gold-core); text-shadow: 0 3px 5px rgba(0,0,0,1); margin-top: -5px; z-index: 4; position: relative;
            background: rgba(0,0,0,0.6); padding: 2px 10px; border-radius: 4px;
        }

        #wrap-losses .stat-value { color: #d0d0d0; -webkit-text-stroke: 3px #000; text-shadow: 0 8px 0px #000000, 0 15px 30px rgba(0,0,0,1); }

  
        .impact-shockwave {
            animation: 
                containerShock 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                hyperFluxFlow 2.5s infinite linear !important;
        }
        @keyframes containerShock {
            0% { transform: scale(1); }
            20% { transform: scale(1.12) translateX(-15px); box-shadow: -25px 0 60px var(--cyan-core), 25px 0 60px var(--blood-core); filter: brightness(2) contrast(1.2); }
            40% { transform: scale(1.08) translateX(15px); box-shadow: 25px 0 60px var(--cyan-core), -25px 0 60px var(--blood-core); }
            100% { transform: scale(1) translateX(0); box-shadow: 0 25px 45px rgba(0,0,0,0.9); filter: brightness(1) contrast(1); }
        }

        .cipher-flash {
            animation: textDecipherSlam 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes textDecipherSlam {
            0% { transform: scale(1); filter: brightness(1); }
            20% { transform: scale(1.3) rotate(-4deg); color: #fff; -webkit-text-stroke: 5px var(--theme-core); text-shadow: 0 0 100px #fff; }
            100% { transform: scale(1) rotate(0deg); color: #fff; -webkit-text-stroke: 3px #000; }
        }

     
        #particle-layer { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
        
        .digital-ash {
            position: absolute; 
            background: var(--blood-core); 
            width: 6px; height: 6px; /* Larger to be seen on small streams */
            box-shadow: 0 0 15px var(--blood-core), 0 0 30px var(--gold-core);
            animation: floatDigital linear infinite;
        }

        @keyframes floatDigital {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: translateY(50vh) translateX(-30px) scale(1.8); opacity: 1; }
            55% { transform: translateY(45vh) translateX(30px) scale(1.8) skewX(25deg); opacity: 0.4; }
            60% { transform: translateY(40vh) translateX(-30px) scale(1.8); opacity: 1; }
            100% { transform: translateY(-100px) translateX(-70px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Background Particle System -->
    <div id="particle-layer"></div>

    <div id="overlay-container">
        
        <!-- Top Protocol Banner -->
        <div class="protocol-banner">
            <div class="protocol-label" id="tier-display">SYS_INIT</div>
            <div class="protocol-sub" id="mode-display">AWAITING CONNECTION</div>
        </div>

        <!-- 1. Total Points -->
        <div class="monolith-wrapper" id="wrap-points">
            <div class="monolith-block">
                <div class="stat-label">Bloodpoints Extracted</div>
                <div class="stat-value" id="val-points" data-val="0">0</div>
            </div>
        </div>

        <!-- 2. Killers Cleared -->
        <div class="monolith-wrapper" id="wrap-cleared">
            <div class="monolith-block">
                <div class="stat-label">Killers Cleansed</div>
                <div class="stat-value" id="val-cleared" data-val="0">0</div>
                <div class="stat-subtext" id="sub-cleared">ROSTER: SCANNING...</div>
            </div>
        </div>

        <!-- 3. Perks Sacrificed -->
        <div class="monolith-wrapper" id="wrap-perks">
            <div class="monolith-block">
                <div class="stat-label">Perks Shattered</div>
                <div class="stat-value" id="val-perks" data-val="0">0</div>
            </div>
        </div>

        <!-- 4. Total Losses -->
        <div class="monolith-wrapper" id="wrap-losses">
            <div class="monolith-block">
                <div class="stat-label">Total Defeats</div>
                <div class="stat-value" id="val-losses" data-val="0">0</div>
            </div>
        </div>

    </div>


    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


        const firebaseConfig = {
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const streamerUsername = urlParams.get('user');
        
        const modeDisplay = document.getElementById('mode-display');
        const tierDisplay = document.getElementById('tier-display');

    
        function spawnDigitalAsh() {
            const layer = document.getElementById('particle-layer');
            setInterval(() => {
                const ash = document.createElement('div');
                ash.classList.add('digital-ash');
                
                // Spawn randomly on the right side
                ash.style.right = `${Math.random() * 450 - 50}px`;
                ash.style.animationDuration = `${Math.random() * 3 + 2.5}s`;
                
                layer.appendChild(ash);
                setTimeout(() => ash.remove(), 6000);
            }, 180); 
        }
        spawnDigitalAsh();

        if (!streamerUsername) {
            tierDisplay.innerText = "ERROR_404";
            modeDisplay.innerText = "NO TARGET ASSIGNED";
            document.querySelector('.protocol-banner').classList.add('hardcore-pulse');
        } else {
            
          
            function hyperDecipherRoll(obj, start, end, duration) {
                let startTimestamp = null;
                const cyberChars = "01X%#8Z"; 
                
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    
                    if (progress < 0.6) {
                        let randomStr = "";
                        const len = end.toString().length;
                        for(let i = 0; i < len; i++) {
                            randomStr += cyberChars[Math.floor(Math.random() * cyberChars.length)];
                        }
                        obj.innerText = randomStr;
                    } else {
                        const easeOut = 1 - Math.pow(1 - ((progress - 0.6) * 2.5), 4);
                        const current = Math.floor(start + (end - start) * easeOut);
                        obj.innerText = current.toLocaleString();
                    }
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        obj.innerText = end.toLocaleString();
                        obj.setAttribute('data-val', end);
                    }
                };
                window.requestAnimationFrame(step);
            }

        
            const previousState = { points: null, cleared: null, perks: null, losses: null };

            function triggerPremiumImpact(elementId, wrapId, newValue, stateKey) {
                const el = document.getElementById(elementId);
                const wrap = document.getElementById(wrapId);
                
                if (previousState[stateKey] !== newValue) {
                    const oldValue = previousState[stateKey] === null ? 0 : previousState[stateKey];
                    
                    // Reset Animations instantly via DOM reflow
                    el.classList.remove('cipher-flash');
                    wrap.classList.remove('impact-shockwave');
                    void wrap.offsetWidth; 
                    
                    // Fire the violent shockwave and bright text slam
                    wrap.classList.add('impact-shockwave');
                    el.classList.add('cipher-flash');
                    
                    hyperDecipherRoll(el, oldValue, newValue, 700);
                    
                    previousState[stateKey] = newValue;
                }
            }

            const userRef = doc(db, 'player_state', streamerUsername);
            
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    
                    const data = docSnap.data();
                    
                    const points = data.points || 0;
                    const currentTier = data.currentTier || 0;
                    const completedArray = data.completed_killers || [];
                    const currentCleansed = completedArray.length;
                    
                    const totalCleansed = (currentTier * 44) + currentCleansed;
                    
                    const stats = data.stats || {};
                    const sacrificed = stats.sacrificed || 0;
                    const losses = stats.losses || 0;
                    const mode = data.mode || 'normal';

                    // Update Top Banner
                    tierDisplay.innerText = `TIER ${currentTier}`;
                    if (mode === 'hardcore') {
                        modeDisplay.innerText = "HARDCORE PROTOCOL ACTIVE";
                        document.querySelector('.protocol-banner').classList.add('hardcore-pulse');
                    } else {
                        modeDisplay.innerText = "NORMAL PROTOCOL ACTIVE";
                        document.querySelector('.protocol-banner').classList.remove('hardcore-pulse');
                    }

                    document.getElementById('sub-cleared').innerText = `${currentCleansed} / 44 (TIER ${currentTier})`;

                    // ---> Initial Load Bypass <---
                    if (previousState.points === null) {
                        document.getElementById('val-points').innerText = points.toLocaleString();
                        document.getElementById('val-cleared').innerText = totalCleansed.toLocaleString();
                        document.getElementById('val-perks').innerText = sacrificed.toLocaleString();
                        document.getElementById('val-losses').innerText = losses.toLocaleString();
                        
                        previousState.points = points;
                        previousState.cleared = totalCleansed;
                        previousState.perks = sacrificed;
                        previousState.losses = losses;
                    } else {
                        triggerPremiumImpact('val-points', 'wrap-points', points, 'points');
                        triggerPremiumImpact('val-cleared', 'wrap-cleared', totalCleansed, 'cleared');
                        triggerPremiumImpact('val-perks', 'wrap-perks', sacrificed, 'perks');
                        triggerPremiumImpact('val-losses', 'wrap-losses', losses, 'losses');
                    }

                } else {
                    modeDisplay.innerText = "AWAITING TARGET DATA...";
                }
            }, (error) => {
                tierDisplay.innerText = "ERROR_503";
                modeDisplay.innerText = "UPLINK SEVERED";
                document.querySelector('.protocol-banner').classList.add('hardcore-pulse');
            });
        }
    </script>
</body>
</html>
