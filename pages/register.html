<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Entity Requires a Sacrifice - Register</title>
    <link rel="stylesheet" href="../assets/css/reg.css">
</head>
<body>
    <!-- FIXED: Image path corrected -->
    <img src="../assets/images/general/camfire.gif" class="bg-gif" alt="Background Animation">
    <nav class="navbar">
            <ul class="nav-links">
                <li><a href="../index.html">Lobby</a></li>
                <li><a href="../pages/Randomizer.html">Randomizer</a></li>
                <li><a href="../pages/Challenges.html">Challenges</a></li>
                <li><a href="../pages/killers.html">Killer Wheel</a></li>
                            <li><a href="../pages/CreatorsLounge.html">Creators</a></li>

            </ul>
        </nav>
    <div class="blood-web-container">
        <h1>Offer Your Soul</h1>
        
        <div class="login-link">
            Already marked by The Entity? <a href="../pages/login.html">Login here</a>
        </div>
        
        <form id="registerForm">
            <!-- Sacrifice Name -->
            <div class="form-group">
                <label for="sacrificeName">Sacrifice Name (Username):</label>
                <input type="text" id="sacrificeName" required placeholder="Enter your display name...">
            </div>

            <!-- 2-Slot Scrollable Perk Lock -->
            <div class="form-group">
                <label>Set Your 2-Perk Secret Lock (Scroll to select):</label>
                <div class="combination-lock" id="combinationLock">
                    <!-- Scroll slots generated by JS -->
                </div>
            </div>

            <!-- Secret Question Category -->
            <div class="form-group">
                <label for="categorySelect">Experience Level:</label>
                <select id="categorySelect" required>
                    <option value="" disabled selected>Select your trial experience...</option>
                    <option value="fresher">Fresher</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="pro">Advanced / Pro</option>
                </select>
            </div>

            <!-- Secret Question Selection -->
            <div class="form-group">
                <label for="questionSelect">Secret Question:</label>
                <select id="questionSelect" required disabled>
                    <option value="" disabled selected>Awaiting experience level...</option>
                </select>
            </div>

            <!-- Secret Question Answer -->
            <div class="form-group">
                <label for="secretAnswer">Answer:</label>
                <input type="text" id="secretAnswer" required placeholder="Your secret answer...">
            </div>

            <button type="submit" class="submit-btn">Enter The Fog</button>
        </form>
        <div id="statusMessage"></div>
    </div>

    <!-- FIXED: Added type="module" -->
    <script type="module" src="../assets/js/register.js"></script>
    <script src="../assets/js/session.js"></script>
</body>
</html>
