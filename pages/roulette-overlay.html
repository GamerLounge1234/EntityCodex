<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Entity's Roulette Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Courier+New&display=swap');

        /* Crucial: Transparent background for OBS */
        body { 
            background: transparent; 
            margin: 0; 
            padding: 20px; 
            overflow: hidden; 
        }

        .overlay-container {
            background: rgba(10, 5, 5, 0.85);
            border: 2px solid #d32f2f;
            border-radius: 8px;
            padding: 15px 30px;
            display: inline-flex;
            gap: 40px;
            box-shadow: 0 0 20px rgba(211, 47, 47, 0.5), inset 0 0 10px rgba(0,0,0,0.8);
            font-family: 'Montserrat', sans-serif;
        }

        .stat-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 14px;
            text-transform: uppercase;
            color: #888899;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 38px;
            font-weight: 900;
            font-family: 'Courier New', monospace;
        }

        .points {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(211, 47, 47, 0.9);
        }

        .streak {
            color: #e5b824;
            text-shadow: 0 0 15px rgba(229, 184, 36, 0.9);
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="stat-block">
            <span class="stat-label">Safe Points</span>
            <span class="stat-value points" id="overlay-points">0</span>
        </div>
        <div class="stat-block">
            <span class="stat-label">Entity Streak</span>
            <span class="stat-value streak" id="overlay-streak">0</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // Notice we import onSnapshot instead of getDoc for real-time live updates
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Paste your exact Firebase Config here
        const firebaseConfig = {
            // YOUR CONFIG HERE
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // This grabs the username from the URL (e.g., overlay.html?user=StreamerName)
        const urlParams = new URLSearchParams(window.location.search);
        const streamerName = urlParams.get('user');

        if (streamerName) {
            const docRef = doc(db, 'roulette_state', streamerName);
            
            // onSnapshot actively listens to the database. 
            // When the streamer updates their points on the main site, this triggers instantly.
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('overlay-points').innerText = data.safeBank || 0;
                    document.getElementById('overlay-streak').innerText = data.totalStreak || 0;
                }
            });
        } else {
            document.getElementById('overlay-points').innerText = "ERR";
            document.getElementById('overlay-streak').innerText = "ERR";
            console.error("No user specified in URL. Format must be: overlay.html?user=Username");
        }
    </script>
</body>
</html>
