<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette HUD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Montserrat:wght@900&display=swap');

        :root {
            --entity-red: #d32f2f;
            --gold-ascension: #e5b824;
            --bg-panel: rgba(10, 5, 5, 0.85);
        }

        /* Transparent background is required for OBS overlays */
        body {
            background-color: transparent;
            margin: 0;
            padding: 10px;
            display: flex;
            gap: 15px;
            overflow: hidden;
        }

        .hud-box {
            background: var(--bg-panel);
            border: 2px solid var(--entity-red);
            border-radius: 6px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.4), inset 0 0 10px rgba(0,0,0,0.8);
            min-width: 120px;
        }

        .hud-label {
            font-family: 'Teko', sans-serif;
            color: #b8a5a5;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: -5px;
        }

        .hud-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .streak-val {
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>
    <div class="hud-box">
        <div class="hud-label">SAFE BANK</div>
        <div class="hud-value" id="safe-bank">0</div>
    </div>
    <div class="hud-box">
        <div class="hud-label">STREAK</div>
        <div class="hud-value streak-val" id="total-streak">0</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Extract streamer username from the URL parameter
        const params = new URLSearchParams(window.location.search);
        const streamerName = params.get('user');

        if (streamerName) {
            // onSnapshot triggers automatically every time the database changes
            onSnapshot(doc(db, 'roulette_state', streamerName), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Update HTML
                    document.getElementById('safe-bank').innerText = (data.safeBank || 0).toLocaleString();
                    document.getElementById('total-streak').innerText = data.totalStreak || 0;
                    
                    // Aesthetic check: Turn the streak Gold if they hit the 50 goal
                    const streakEl = document.getElementById('total-streak');
                    if (data.totalStreak >= 50) {
                        streakEl.style.color = "var(--gold-ascension)";
                        streakEl.style.textShadow = "0 0 20px rgba(229, 184, 36, 0.8)";
                    } else {
                        streakEl.style.color = "#00ff66";
                        streakEl.style.textShadow = "0 0 15px rgba(0, 255, 102, 0.4)";
                    }
                }
            });
        } else {
            document.getElementById('safe-bank').innerText = "ERR";
            document.getElementById('total-streak').innerText = "NO_USER";
        }
    </script>
</body>
</html>
