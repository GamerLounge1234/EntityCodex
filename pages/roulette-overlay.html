<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Roulette - Stream Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@400;700;900&display=swap');

        /* Transparent background for OBS */
        body {
            background: transparent;
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 15px;
        }

        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
        }

        .glass-card {
            background: rgba(10, 5, 5, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(211, 47, 47, 0.25);
            border-left: 5px solid #d32f2f;
            border-radius: 8px;
            padding: 15px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(211, 47, 47, 0.1);
            transition: all 0.3s ease;
        }

        .glass-card.gold-tier {
            border-left-color: #e5b824;
            border-color: rgba(229, 184, 36, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(229, 184, 36, 0.1);
        }

        .data-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888899;
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .data-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-family: 'Teko', sans-serif;
            letter-spacing: 1px;
            line-height: 1;
        }

        .text-safe { color: #f0f0f5; }
        .text-pot { color: #d32f2f; text-shadow: 0 0 15px rgba(211, 47, 47, 0.6); }
        .text-streak { color: #e5b824; text-shadow: 0 0 15px rgba(229, 184, 36, 0.6); }
        .text-jail { color: #ff5500; }

        .split-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-metric {
            display: flex;
            flex-direction: column;
        }

        /* Subtle pulse animation for the active pot */
        @keyframes pulsePot {
            0%, 100% { text-shadow: 0 0 10px rgba(211, 47, 47, 0.5); }
            50% { text-shadow: 0 0 25px rgba(211, 47, 47, 0.9); }
        }
        .active-pot-anim { animation: pulsePot 2s infinite; }
    </style>
</head>
<body>

    <div class="overlay-container" id="overlay-ui" style="display: none;">
        
        <!-- Safe Bank & Current Pot -->
        <div class="glass-card">
            <div class="data-label">Safe Bank (Points)</div>
            <div class="data-value text-safe" id="ov-safe">0</div>
            
            <div style="height: 1px; background: rgba(255,255,255,0.1); margin: 12px 0;"></div>
            
            <div class="data-label" style="color: #d32f2f;">Current Active Pot</div>
            <div class="data-value text-pot active-pot-anim" id="ov-pot">0</div>
        </div>

        <!-- Streaks -->
        <div class="glass-card gold-tier">
            <div class="split-row">
                <div class="sub-metric">
                    <div class="data-label" style="color: #e5b824;">Active Streak</div>
                    <div class="data-value text-streak" id="ov-streak">0</div>
                </div>
                <div class="sub-metric" style="text-align: right;">
                    <div class="data-label">Best Streak</div>
                    <div class="data-value text-safe" id="ov-best-streak" style="font-size: 1.8rem;">0</div>
                </div>
            </div>
        </div>

        <!-- Ransom Jail -->
        <div class="glass-card" style="border-left-color: #ff5500;">
            <div class="split-row">
                <div class="data-label" style="margin: 0;">Perks in Ransom Jail</div>
                <div class="data-value text-jail" id="ov-jail" style="font-size: 1.8rem;">0</div>
            </div>
        </div>

    </div>

    <!-- Error State -->
    <div id="error-msg" style="color: red; font-family: 'Teko', sans-serif; font-size: 1.5rem; text-transform: uppercase;">
        Awaiting connection...
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // IMPORTANT: Paste your exact Firebase config here
        const firebaseConfig = {
           apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Get the streamer's username from the URL (e.g., ?user=Otzdarva)
        const urlParams = new URLSearchParams(window.location.search);
        const targetUser = urlParams.get('user');

        if (!targetUser) {
            document.getElementById('error-msg').innerText = "ERROR: NO USER SPECIFIED IN URL. Add ?user=USERNAME";
        } else {
            // 2. Listen to the database in real-time securely (Read-Only)
            const docRef = doc(db, 'roulette_state', targetUser);
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    document.getElementById('error-msg').style.display = 'none';
                    document.getElementById('overlay-ui').style.display = 'flex';
                    
                    const data = docSnap.data();
                    
                    // Update UI elements instantly
                    document.getElementById('ov-safe').innerText = data.safeBank || 0;
                    document.getElementById('ov-pot').innerText = data.currentPot || 0;
                    document.getElementById('ov-streak').innerText = data.totalStreak || 0;
                    document.getElementById('ov-best-streak').innerText = data.highestStreak || 0;
                    document.getElementById('ov-jail').innerText = (data.ransomJail || []).length;
                } else {
                    document.getElementById('overlay-ui').style.display = 'none';
                    document.getElementById('error-msg').style.display = 'block';
                    document.getElementById('error-msg').innerText = `USER '${targetUser}' NOT FOUND.`;
                }
            }, (error) => {
                console.error("Database connection failed:", error);
            });
        }
    </script>
</body>
</html>
