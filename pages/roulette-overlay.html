<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette - AAA DBD Overlay</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Teko:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* DBD Entity Palette */
            --entity-black: #050508;
            --fog-glass: rgba(15, 15, 20, 0.65);
            --fog-glass-solid: rgba(18, 18, 25, 0.95);
            
            --blood-glow: #e5002a;   --blood-dark: #3a000a;
            --auric-glow: #ffc400;   --auric-dark: #4a3800;
            --ethereal-glow: #00e5ff;--ethereal-dark: #003a45;
            --obsidian-glow: #ffffff;--obsidian-dark: #2a2a35;
            --void-glow: #a600ff;    --void-dark: #260040;

            --font-ui: 'Teko', sans-serif;
            --font-data: 'Montserrat', sans-serif;
            
            /* AAA Physics & Easing */
            --ease-spring: cubic-bezier(0.175, 0.885, 0.32, 1.15);
            --ease-cinematic: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: transparent !important; 
            overflow: hidden; 
            font-family: var(--font-data);
            -webkit-font-smoothing: antialiased;
        }

        /* 1. AAA FEATURE: Ambient Fog Vignette (Bound to wrapper only) */
        #perspective-wrapper {
            position: absolute; top: 0; right: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: flex-end;
            padding: 30px 40px 0 0; 
            perspective: 1200px;
        }

        /* 2. AAA FEATURE: Continuous 3D Ambient Oscillation */
        #cycle-wrapper {
            position: relative;
            width: 440px; 
            height: 100%;
            transform-style: preserve-3d;
            animation: ambientFloat 8s ease-in-out infinite alternate;
        }
        @keyframes ambientFloat {
            0% { transform: rotateY(-2deg) rotateX(1deg) translateY(0px); }
            100% { transform: rotateY(2deg) rotateX(-1deg) translateY(-8px); }
        }

        /* --- SCREEN STATES --- */
        .screen-state {
            position: absolute; top: 0; right: 0; width: 100%;
            display: flex; flex-direction: column; gap: 20px;
            transition: opacity 1s var(--ease-cinematic), transform 1s var(--ease-cinematic), filter 1s var(--ease-cinematic);
        }

        .state-active { opacity: 1; transform: translateZ(0) translateX(0); filter: blur(0px); }
        .state-hidden { opacity: 0; transform: translateZ(-50px) translateX(40px); filter: blur(15px); }

        /* =========================================
           AAA INTRO SCREEN & THICK ANIMATED BORDER 
           ========================================= */
        
        /* 3. AAA FEATURE: Thick, Smooth Animated Conic Borders */
        .intro-card {
            position: relative;
            border-radius: 16px;
            padding: 6px; /* Thick Border */
            background: var(--fog-glass-solid);
            box-shadow: 0 15px 50px rgba(229, 0, 42, 0.4), inset 0 0 20px rgba(0,0,0,1);
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* Spinning Border Mask */
        .intro-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent 30%, var(--blood-glow) 70%, #fff 100%);
            animation: spinThickBorder 2.5s linear infinite;
            z-index: 0;
        }
        
        /* Inner card covering the middle to create the border effect */
        .intro-inner {
            position: relative;
            background: linear-gradient(135deg, var(--entity-black), rgba(20, 5, 10, 0.95));
            border-radius: 12px; /* Smooth corners parallel to outer 16px */
            padding: 50px 30px;
            z-index: 2;
            display: flex; align-items: center; justify-content: center; text-align: center;
            box-shadow: inset 0 0 80px rgba(229, 0, 42, 0.15);
        }

        /* 4. AAA FEATURE: Cinematic Collapse Text Reveal */
        .intro-title {
            font-family: var(--font-data); font-size: 3.8rem; font-weight: 900;
            font-style: italic; line-height: 1.1; color: #fff;
            text-transform: uppercase; 
            text-shadow: 0 0 20px var(--blood-glow);
            animation: textCollapse 1.5s var(--ease-spring) forwards;
        }
        .intro-title span { color: var(--blood-glow); text-shadow: 0 0 40px var(--blood-glow), 0 0 10px #fff; }

        @keyframes textCollapse {
            0% { opacity: 0; transform: scale(1.5) translateZ(100px); letter-spacing: 30px; filter: blur(20px) brightness(3); }
            50% { opacity: 1; transform: scale(0.95) translateZ(-10px); letter-spacing: -2px; filter: blur(0px) brightness(1.5); }
            100% { opacity: 1; transform: scale(1) translateZ(0); letter-spacing: -1px; filter: blur(0px) brightness(1); }
        }

        @keyframes spinThickBorder { 100% { transform: rotate(360deg); } }

        /* =========================================
           AAA STATS HUD & DYNAMIC READABILITY 
           ========================================= */

        #connection-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 5px 10px 5px; border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        /* Cleaned out extra text, kept only the functional Streamer target */
        #connection-status {
            font-family: var(--font-ui); font-size: 2.2rem; color: #fff;
            text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 15px; font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,1);
            width: 100%; justify-content: space-between;
        }

        /* 5. AAA FEATURE: Pulse-Width Heartbeat Indicator */
        .status-ring {
            width: 16px; height: 16px; border-radius: 50%;
            background: var(--blood-glow);
            box-shadow: 0 0 15px var(--blood-glow);
        }
        .status-ring.connected { 
            background: #00ff66; 
            box-shadow: 0 0 20px #00ff66, 0 0 40px rgba(0,255,102,0.4); 
            animation: dbdHeartbeat 1.2s infinite; 
        }
        @keyframes dbdHeartbeat {
            0%, 20%, 40%, 100% { transform: scale(1); opacity: 1; }
            10%, 30% { transform: scale(1.3); opacity: 0.8; }
        }

        /* --- STAT BLOCKS --- */
        /* 6. AAA FEATURE: Staggered Matrix Drop-in & Glassmorphism 2.0 */
        .stat-block-wrapper {
            position: relative;
            border-radius: 14px; 
            padding: 4px; /* Thick Edge Glow */
            background: var(--entity-black);
            opacity: 0;
            animation: matrixDrop 0.8s var(--ease-spring) forwards;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        #wrap-safe   { animation-delay: 0.1s; --theme-color: var(--auric-glow); --theme-dark: var(--auric-dark); }
        #wrap-pot    { animation-delay: 0.2s; --theme-color: var(--blood-glow); --theme-dark: var(--blood-dark); }
        #wrap-streak { animation-delay: 0.3s; --theme-color: var(--ethereal-glow); --theme-dark: var(--ethereal-dark); }
        #wrap-best   { animation-delay: 0.4s; --theme-color: var(--obsidian-glow); --theme-dark: var(--obsidian-dark); }
        #wrap-jail   { animation-delay: 0.5s; --theme-color: var(--void-glow); --theme-dark: var(--void-dark); }

        @keyframes matrixDrop {
            0% { opacity: 0; transform: translateY(40px) scale(0.9); clip-path: polygon(0 0, 100% 0, 100% 0, 0 0); }
            100% { opacity: 1; transform: translateY(0) scale(1); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        }

        /* Smooth Edge Glowing Border using Masks */
        .edge-glow {
            position: absolute; inset: 0; border-radius: 14px;
            background: var(--fog-glass-solid);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; z-index: 3;
            padding: 2px;
        }
        
        .edge-glow::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent 40%, var(--theme-color) 80%, #fff 100%);
            animation: borderRun 4s linear infinite;
        }
        @keyframes borderRun { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Inner Content (Extremely High Visibility) */
        .stat-block {
            position: relative;
            background: radial-gradient(circle at 100% 0%, rgba(255,255,255,0.03) 0%, transparent 70%),
                        linear-gradient(145deg, var(--fog-glass) 0%, var(--entity-black) 100%);
            border-radius: 10px; /* Perfectly aligns with outer 14px minus 4px padding */
            padding: 12px 24px 16px 24px; 
            display: flex; flex-direction: column; justify-content: center;
            z-index: 2; overflow: hidden;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }

        /* 7. AAA FEATURE: Sweeping Holographic Glare */
        .stat-block::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transform: skewX(-25deg);
            animation: holoGlare 6s infinite;
            pointer-events: none;
        }
        @keyframes holoGlare {
            0%, 60% { left: -150%; } 100% { left: 200%; }
        }

        /* Titles / Labels (No extra text, just what's needed) */
        .stat-label {
            font-family: var(--font-ui); font-size: 1.8rem; text-transform: uppercase;
            letter-spacing: 2px; font-weight: 700; color: #d0d0e0;
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: -15px; z-index: 4; position: relative;
            text-shadow: 0 2px 4px rgba(0,0,0,1);
        }

        /* 8. AAA FEATURE: Huge, Scalable OLED True-Black Contrast Values */
        .stat-value {
            font-family: var(--font-data); font-size: 5.5rem; font-weight: 900;
            font-style: italic; line-height: 1; letter-spacing: -2px; 
            color: #ffffff; 
            text-shadow: 0 5px 25px var(--theme-color), 0 0 5px #fff;
            z-index: 4; position: relative;
        }

        .stat-subtext {
            font-family: var(--font-ui); font-size: 1.5rem; letter-spacing: 2px; font-weight: 700;
            color: #fff; z-index: 4; position: relative; margin-top: -5px;
            display: inline-block;
        }

        /* 9. AAA FEATURE: Chromatic Aberration & Micro-Recoil Update Animation */
        .update-flash-container { animation: microRecoil 0.6s var(--ease-spring) forwards; }
        @keyframes microRecoil {
            0% { transform: scale(1); background: var(--entity-black); }
            15% { transform: scale(1.04); background: var(--theme-dark); box-shadow: inset 0 0 60px var(--theme-color); }
            100% { transform: scale(1); background: var(--entity-black); box-shadow: none; }
        }

        .update-pop-text { animation: chromaticGlitch 0.6s var(--ease-spring) forwards; }
        @keyframes chromaticGlitch {
            0% { transform: scale(1); text-shadow: 0 5px 25px var(--theme-color); filter: brightness(1); }
            15% { 
                transform: scale(1.15); filter: brightness(1.5);
                text-shadow: -4px 0 #00ffff, 4px 0 #ff003c, 0 0 30px #fff; 
            }
            30% { text-shadow: 4px 0 #00ffff, -4px 0 #ff003c; }
            100% { transform: scale(1); text-shadow: 0 5px 25px var(--theme-color); filter: brightness(1); }
        }

        .multi-high { color: var(--blood-glow); text-shadow: 0 0 20px var(--blood-glow); animation: pulseDanger 0.8s infinite alternate; }
        @keyframes pulseDanger { to { transform: scale(1.05); filter: brightness(1.2); } }

    </style>
</head>
<body>

    <div id="perspective-wrapper">
        <div id="cycle-wrapper">
            
            <!-- INTRO SCREEN -->
            <div id="intro-screen" class="screen-state state-active">
                <div class="intro-card">
                    <div class="intro-inner">
                        <div class="intro-title">Entity's<br><span>Roulette</span></div>
                    </div>
                </div>
            </div>

            <!-- STATS HUD -->
            <div id="stats-screen" class="screen-state state-hidden">
                
                <div id="connection-header">
                    <div id="connection-status">
                        <span id="streamer-name-display">CONNECTING...</span>
                        <div class="status-ring" id="dot-status"></div>
                    </div>
                </div>

                <!-- Block 1 -->
                <div class="stat-block-wrapper" id="wrap-safe">
                    <div class="edge-glow"></div>
                    <div class="stat-block" id="box-safe">
                        <div class="stat-label">Safe Bank</div>
                        <div class="stat-value" id="val-safe">0</div>
                    </div>
                </div>

                <!-- Block 2 -->
                <div class="stat-block-wrapper" id="wrap-pot">
                    <div class="edge-glow"></div>
                    <div class="stat-block" id="box-pot">
                        <div class="stat-label">Sacrificial Pot</div>
                        <div class="stat-value" id="val-pot">0</div>
                        <div class="stat-subtext" id="sub-multiplier">MULTI: 1.0x</div>
                    </div>
                </div>

                <!-- Block 3 -->
                <div class="stat-block-wrapper" id="wrap-streak">
                    <div class="edge-glow"></div>
                    <div class="stat-block" id="box-streak">
                        <div class="stat-label">Current Streak</div>
                        <div class="stat-value" id="val-streak">0</div>
                    </div>
                </div>

                <!-- Block 4 -->
                <div class="stat-block-wrapper" id="wrap-best">
                    <div class="edge-glow"></div>
                    <div class="stat-block" id="box-best">
                        <div class="stat-label">Highest Streak</div>
                        <div class="stat-value" id="val-best">0</div>
                    </div>
                </div>

                <!-- Block 5 -->
                <div class="stat-block-wrapper" id="wrap-jail">
                    <div class="edge-glow"></div>
                    <div class="stat-block" id="box-jail">
                        <div class="stat-label">Perks in Jail</div>
                        <div class="stat-value" id="val-jail">0</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const streamerUsername = urlParams.get('user');
        
        const statusText = document.getElementById('streamer-name-display');
        const statusDot = document.getElementById('dot-status');

        // ==== LOOPING LOGIC ====
        const introScreen = document.getElementById('intro-screen');
        const statsScreen = document.getElementById('stats-screen');
        
        function runOverlayLoop() {
            // Re-trigger text collapse by resetting clone
            const oldIntro = introScreen.querySelector('.intro-card');
            const newIntro = oldIntro.cloneNode(true);
            oldIntro.parentNode.replaceChild(newIntro, oldIntro);

            introScreen.classList.remove('state-hidden');
            introScreen.classList.add('state-active');
            statsScreen.classList.remove('state-active');
            statsScreen.classList.add('state-hidden');

            setTimeout(() => {
                introScreen.classList.remove('state-active');
                introScreen.classList.add('state-hidden');
                
                // Re-trigger Matrix Drops
                const statWrappers = statsScreen.querySelectorAll('.stat-block-wrapper');
                statWrappers.forEach(wrap => {
                    wrap.style.animation = 'none';
                    void wrap.offsetWidth; 
                    wrap.style.animation = null;
                });

                statsScreen.classList.remove('state-hidden');
                statsScreen.classList.add('state-active');

                setTimeout(runOverlayLoop, 15000); 
            }, 3500); 
        }
        
        runOverlayLoop();

        // ==== FIREBASE DATA ====
        if (!streamerUsername) {
            statusText.innerText = "NO TARGET";
            statusText.style.color = "var(--blood-glow)";
        } else {
            statusText.innerText = streamerUsername.toUpperCase();
            
            function easeOutExpo(x) { return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }

            // 10. AAA FEATURE: Motion-Blurred Number Rolling via JS
            function slotMachineRoll(obj, start, end, duration) {
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    
                    const easedProgress = easeOutExpo(progress);
                    const current = Math.floor(start + (end - start) * easedProgress);
                    
                    // Dynamic blur based on speed (progress)
                    if (progress < 0.8) {
                        obj.style.filter = `blur(2px) contrast(1.5)`;
                        obj.style.transform = `scale(1.02)`;
                    } else {
                        obj.style.filter = 'none'; 
                        obj.style.transform = `scale(1)`;
                    }

                    obj.innerText = current.toLocaleString();
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        obj.innerText = end.toLocaleString();
                        obj.style.filter = 'none'; 
                        obj.style.transform = `scale(1)`;
                    }
                };
                window.requestAnimationFrame(step);
            }

            const previousState = {
                safeBank: null, currentPot: null, totalStreak: null, highestStreak: null, ransomJail: null
            };

            function triggerPremiumUpdate(elementId, boxId, newValue, stateKey) {
                const el = document.getElementById(elementId);
                const box = document.getElementById(boxId);
                
                if (previousState[stateKey] !== newValue) {
                    const oldValue = previousState[stateKey] === null ? 0 : previousState[stateKey];
                    
                    el.classList.remove('update-pop-text');
                    box.classList.remove('update-flash-container');
                    void box.offsetWidth; 
                    
                    box.classList.add('update-flash-container');
                    el.classList.add('update-pop-text');
                    
                    slotMachineRoll(el, oldValue, newValue, 1200); 
                    
                    previousState[stateKey] = newValue;
                }
            }

            const userRef = doc(db, 'roulette_state', streamerUsername);
            
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    statusDot.classList.add('connected');
                    
                    const data = docSnap.data();
                    const safeBank = data.safeBank || 0;
                    const currentPot = data.currentPot || 0;
                    const totalStreak = data.totalStreak || 0;
                    const highestStreak = data.highestStreak || 0;
                    
                    const currentLocalStreak = data.currentLocalStreak || 0;
                    const multiplier = 1.0 + (currentLocalStreak * 0.5);
                    const multiEl = document.getElementById('sub-multiplier');
                    multiEl.innerText = `MULTI: ${multiplier.toFixed(1)}x`;
                    
                    if (multiplier >= 2.0) {
                        multiEl.classList.add('multi-high');
                    } else {
                        multiEl.classList.remove('multi-high');
                    }

                    const jailArray = data.ransomJail || [];
                    const perksInJail = jailArray.length;

                    triggerPremiumUpdate('val-safe', 'box-safe', safeBank, 'safeBank');
                    triggerPremiumUpdate('val-pot', 'box-pot', currentPot, 'currentPot');
                    triggerPremiumUpdate('val-streak', 'box-streak', totalStreak, 'totalStreak');
                    triggerPremiumUpdate('val-best', 'box-best', highestStreak, 'highestStreak');
                    triggerPremiumUpdate('val-jail', 'box-jail', perksInJail, 'ransomJail');

                } else {
                    statusText.innerText = "NO SIGNAL";
                    statusDot.classList.remove('connected');
                }
            }, (error) => {
                statusText.innerText = "LINK LOST";
                statusDot.classList.remove('connected');
            });
        }
    </script>
</body>
</html>
