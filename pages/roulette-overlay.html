
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette - Premium Stream Overlay</title>

    <!-- Premium Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Teko:wght@500;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           PREMIUM CSS ARCHITECTURE - THE FOG'S AESTHETIC
           ========================================================================== */
        
        :root {
            /* Core Palette */
            --entity-red: #d32f2f;
            --entity-blood: #9a031e;
            --entity-dark: #4a0000;
            --gold-ascension: #e5b824;
            --gold-dark: #b8860b;
            --bone-white: #ffffff;
            --muted-bone: #888899;
            --jail-blue: #4a90e2;
            
            /* Glassmorphism & Backgrounds */
            --glass-bg: rgba(8, 5, 8, 0.75);
            --glass-border: rgba(255, 255, 255, 0.07);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            
            /* Glows & Shadows */
            --shadow-base: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
            --glow-red: 0 0 15px rgba(211, 47, 47, 0.5), inset 0 0 10px rgba(211, 47, 47, 0.2);
            --glow-gold: 0 0 20px rgba(229, 184, 36, 0.5), inset 0 0 15px rgba(229, 184, 36, 0.2);
            
            /* Typography */
            --font-label: 'Montserrat', sans-serif;
            --font-value: 'Teko', sans-serif;
            --font-mono: 'Courier Prime', monospace;
            
            /* Spacing & Layout */
            --module-gap: 16px;
            --border-radius: 4px;
        }

        /* 
         * OBS / XSplit Specific Overrides 
         * The body MUST be transparent so the game shows behind it.
         */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: transparent !important;
            overflow: hidden; /* Prevent scrollbars in OBS */
        }

        /* 
         * The Main Container 
         * Designed to sit perfectly in a corner (default: top-right)
         */
        #overlay-container {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: var(--module-gap);
            width: 320px;
            /* Filter applies to the whole container to make it pop over gameplay */
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.8));
        }

        /* ==========================================================================
           MODULAR COMPONENT DESIGN (SEPARATED BLOCKS)
           ========================================================================== */
        
        .stat-module {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-left: 4px solid #333; /* Default left border */
            border-radius: var(--border-radius);
            padding: 16px 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* The moving gradient line at the top of every module */
        .stat-module::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: scanline 4s linear infinite;
        }

        /* ==========================================================================
           TYPOGRAPHY SCULPTING (NO ICONS)
           ========================================================================== */

        .stat-label {
            font-family: var(--font-label);
            color: var(--muted-bone);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 2px;
            z-index: 2;
        }

        .stat-value {
            font-family: var(--font-value);
            color: var(--bone-white);
            font-size: 2.8rem;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            z-index: 2;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .stat-subtext {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: #666;
            font-weight: normal;
            letter-spacing: 0;
        }

        /* ==========================================================================
           THEMATIC MODULE STYLES (COLOR CODING)
           ========================================================================== */

        /* 1. Safe Bank (The Goal) */
        .module-safe {
            border-left-color: var(--bone-white);
            background: linear-gradient(135deg, rgba(15,15,15,0.85) 0%, rgba(5,5,5,0.95) 100%);
        }
        .module-safe .stat-value {
            color: var(--bone-white);
        }

        /* 2. Active Pot (Greed / Risk) */
        .module-pot {
            border-left-color: var(--entity-red);
            background: linear-gradient(135deg, rgba(30,5,5,0.85) 0%, rgba(10,2,2,0.95) 100%);
            box-shadow: inset 0 0 0 rgba(211, 47, 47, 0);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .module-pot .stat-value {
            color: var(--entity-red);
            text-shadow: 0 0 15px rgba(211, 47, 47, 0.4);
        }
        .module-pot.has-pot {
            border-color: var(--entity-red);
            box-shadow: var(--glow-red);
            animation: breatheRed 3s infinite alternate;
        }
        /* Golden Mode override for Pot */
        .module-pot.golden-mode {
            border-color: var(--gold-ascension);
            border-left-color: var(--gold-ascension);
            box-shadow: var(--glow-gold);
            animation: breatheGold 2s infinite alternate;
        }
        .module-pot.golden-mode .stat-value {
            color: var(--gold-ascension);
            text-shadow: 0 0 15px rgba(229, 184, 36, 0.6);
        }
        .module-pot.golden-mode .stat-label::after {
            content: " [GOLDEN]";
            color: var(--gold-ascension);
            animation: flashText 1s infinite;
        }

        /* 3. Universal Streak (Momentum) */
        .module-streak {
            border-left-color: var(--gold-ascension);
        }
        .module-streak .stat-value {
            color: var(--gold-ascension);
        }
        
        /* 4. Best Streak (Legacy) */
        .module-best {
            border-left-color: #555;
            padding: 12px 20px; /* Slightly smaller to indicate secondary stat */
        }
        .module-best .stat-value {
            font-size: 2rem;
            color: #aaa;
        }

        /* 5. Ransom Jail (Punishment) */
        .module-jail {
            border-left-color: var(--jail-blue);
            padding: 12px 20px;
        }
        .module-jail .stat-value {
            font-size: 2rem;
            color: var(--jail-blue);
        }
        .module-jail.danger {
            border-left-color: var(--entity-red);
            animation: glitchBorder 0.2s infinite;
        }

        /* ==========================================================================
           ANIMATIONS & KEYFRAMES FOR PREMIUM FEEL
           ========================================================================== */

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes breatheRed {
            0% { box-shadow: 0 0 10px rgba(211,47,47,0.2), inset 0 0 5px rgba(211,47,47,0.1); }
            100% { box-shadow: 0 0 25px rgba(211,47,47,0.6), inset 0 0 15px rgba(211,47,47,0.3); }
        }

        @keyframes breatheGold {
            0% { box-shadow: 0 0 10px rgba(229,184,36,0.2), inset 0 0 5px rgba(229,184,36,0.1); }
            100% { box-shadow: 0 0 30px rgba(229,184,36,0.7), inset 0 0 20px rgba(229,184,36,0.4); }
        }

        @keyframes flashText {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes dataUpdate {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.05); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        .update-flash {
            animation: dataUpdate 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes glitchBorder {
            0% { border-left-color: var(--entity-red); transform: translateX(0); }
            20% { border-left-color: #fff; transform: translateX(-2px); }
            40% { border-left-color: var(--entity-red); transform: translateX(2px); }
            60% { border-left-color: #fff; transform: translateX(-1px); }
            80% { border-left-color: var(--entity-red); transform: translateX(1px); }
            100% { border-left-color: var(--entity-red); transform: translateX(0); }
        }

        /* Error state if no user provided */
        #error-msg {
            color: var(--entity-red);
            font-family: var(--font-mono);
            background: #000;
            padding: 20px;
            border: 2px solid var(--entity-red);
            display: none;
            text-align: center;
        }

    </style>
</head>
<body>

    <!-- OBS Error Message -->
    <div id="error-msg">
        ERROR: No User Defined.<br>
        Add ?user=YourUsername to the OBS URL.
    </div>

    <!-- Main Overlay Container -->
    <div id="overlay-container" style="display: none;">
        
        <!-- MODULE 1: Safe Bank (Overall Goal) -->
        <div class="stat-module module-safe" id="mod-safe">
            <div class="stat-label">Total Safe Bank</div>
            <div class="stat-value">
                <span id="val-safe">0</span>
                <span class="stat-subtext">/ 20,000</span>
            </div>
        </div>

        <!-- MODULE 2: Active Pot (Current Match Risk) -->
        <div class="stat-module module-pot" id="mod-pot">
            <div class="stat-label" id="label-pot">Active Pot</div>
            <div class="stat-value">
                <span id="val-pot">0</span>
                <span class="stat-subtext">PTS</span>
            </div>
        </div>

        <!-- MODULE 3: Universal Streak -->
        <div class="stat-module module-streak" id="mod-streak">
            <div class="stat-label">Universal Streak</div>
            <div class="stat-value">
                <span id="val-streak">0</span>
                <span class="stat-subtext">WINS</span>
            </div>
        </div>

        <!-- MODULE 4: Highest Streak (Smaller Module) -->
        <div class="stat-module module-best" id="mod-best">
            <div class="stat-label">Highest Streak</div>
            <div class="stat-value" id="val-best">0</div>
        </div>

        <!-- MODULE 5: Ransom Jail (Smaller Module) -->
        <div class="stat-module module-jail" id="mod-jail">
            <div class="stat-label">Perks In Jail</div>
            <div class="stat-value" id="val-jail">0</div>
        </div>

    </div>

    <!-- ==========================================================================
         FIREBASE & LOGIC ENGINE
         ========================================================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. YOUR FIREBASE CONFIGURATION (Paste your config here)
        const firebaseConfig = {
            // REPLACE THIS WITH YOUR FIREBASE CONFIG
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. PARSE THE STREAMER'S USERNAME FROM THE URL
        // Example OBS URL: http://.../roulette_overlay.html?user=YatoTheMad
        const urlParams = new URLSearchParams(window.location.search);
        const targetUser = urlParams.get('user');

        if (!targetUser) {
            // If the streamer forgot to add ?user= in OBS, show a massive error so they fix it.
            document.getElementById('error-msg').style.display = 'block';
        } else {
            document.getElementById('overlay-container').style.display = 'flex';
            OverlayEngine.init(targetUser);
        }

        // 3. OVERLAY LOGIC ENGINE
        const OverlayEngine = {
            // Memory states to trigger animations only when a number actually changes
            state: {
                safeBank: null,
                currentPot: null,
                totalStreak: null,
                highestStreak: null,
                jailCount: null,
                isGolden: null
            },

            init(username) {
                console.log(`[Entity Overlay] Connecting to feed for: ${username}`);
                
                const docRef = doc(db, "roulette_state", username);
                
                // Real-time listener. This triggers instantly whenever the main website saves to DB.
                onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        this.processData(data);
                    } else {
                        console.warn("[Entity Overlay] Target user not found in database.");
                    }
                }, (error) => {
                    console.error("[Entity Overlay] Connection severed:", error);
                });
            },

            processData(data) {
                // Safely extract data
                const safeBank = data.safeBank || 0;
                const currentPot = data.currentPot || 0;
                const totalStreak = data.totalStreak || 0;
                const highestStreak = data.highestStreak || 0;
                const jailCount = data.ransomJail ? data.ransomJail.length : 0;
                const isGolden = data.isGoldenMode || false;

                // Update UI visually
                this.updateElement('val-safe', safeBank, 'safeBank', 'mod-safe');
                this.updateElement('val-pot', currentPot, 'currentPot', 'mod-pot');
                this.updateElement('val-streak', totalStreak, 'totalStreak', 'mod-streak');
                this.updateElement('val-best', highestStreak, 'highestStreak', 'mod-best');
                this.updateElement('val-jail', jailCount, 'jailCount', 'mod-jail');

                // Handle Special UI States
                this.handleSpecialStates(currentPot, isGolden, jailCount);
            },

            updateElement(elementId, newValue, stateKey, parentModuleId) {
                // Format numbers with commas (e.g., 20,000) for a premium look
                const formattedValue = newValue.toLocaleString('en-US');
                
                if (this.state[stateKey] !== newValue) {
                    const el = document.getElementById(elementId);
                    el.textContent = formattedValue;
                    
                    // Trigger the flash animation because the data changed
                    if (this.state[stateKey] !== null) {
                        this.triggerFlash(parentModuleId);
                        this.animateNumberCounter(el, this.state[stateKey], newValue);
                    }
                    
                    this.state[stateKey] = newValue;
                }
            },

            handleSpecialStates(currentPot, isGolden, jailCount) {
                const modPot = document.getElementById('mod-pot');
                const modJail = document.getElementById('mod-jail');

                // Pot Logic (Breathe when active, turn Gold when in Golden Spin)
                if (currentPot > 0) {
                    modPot.classList.add('has-pot');
                    if (isGolden) {
                        modPot.classList.add('golden-mode');
                    } else {
                        modPot.classList.remove('golden-mode');
                    }
                } else {
                    modPot.classList.remove('has-pot');
                    modPot.classList.remove('golden-mode');
                }

                // Jail Logic (Glitch border if jail is getting dangerously full)
                if (jailCount > 10) {
                    modJail.classList.add('danger');
                } else {
                    modJail.classList.remove('danger');
                }
            },

            triggerFlash(moduleId) {
                const mod = document.getElementById(moduleId);
                // Remove class, trigger reflow, add class to restart CSS animation
                mod.classList.remove('update-flash');
                void mod.offsetWidth; 
                mod.classList.add('update-flash');
            },

            // Premium Number Ticking Animation
            animateNumberCounter(element, start, end) {
                // If the jump is massive or it's a reset, just snap to it to avoid long counting
                if (Math.abs(end - start) > 5000 || end === 0) {
                    element.textContent = end.toLocaleString('en-US');
                    return;
                }

                let current = start;
                const range = end - start;
                const increment = end > start ? Math.max(1, Math.floor(range / 20)) : Math.min(-1, Math.ceil(range / 20));
                const timer = setInterval(() => {
                    current += increment;
                    if ((increment > 0 && current >= end) || (increment < 0 && current <= end)) {
                        clearInterval(timer);
                        current = end;
                    }
                    element.textContent = current.toLocaleString('en-US');
                }, 30);
            }
        };
    </script>
</body>
</html>
