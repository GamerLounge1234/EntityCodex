<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette - Premium OBS Overlay</title>
    
    <!-- Premium Fonts: Teko for Numbers, Montserrat for Labels -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;900&family=Teko:wght@400;600;700&display=swap');

        /* ==========================================================================
           PREMIUM OBS OVERLAY STYLES
           ========================================================================== */
        :root {
            --glass-bg: rgba(5, 2, 2, 0.45);
            --glass-border: rgba(255, 40, 40, 0.15);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            
            --blood-red: #d32f2f;
            --neon-red: #ff1e1e;
            --dark-red: #7a0000;
            
            --gold-base: #e5b824;
            --gold-neon: #ffcf33;
            
            --text-muted: #a0a0b0;
            --text-bright: #ffffff;
            
            --glow-red: 0 0 10px rgba(255, 30, 30, 0.6), 0 0 20px rgba(255, 30, 30, 0.4), 0 0 40px rgba(211, 47, 47, 0.2);
            --glow-gold: 0 0 10px rgba(229, 184, 36, 0.6), 0 0 20px rgba(229, 184, 36, 0.4), 0 0 40px rgba(229, 184, 36, 0.2);
            --glow-white: 0 0 10px rgba(255, 255, 255, 0.4), 0 0 20px rgba(255, 255, 255, 0.2);
        }

        /* Transparent background for OBS */
        body {
            margin: 0;
            padding: 20px;
            background-color: transparent; /* CRITICAL FOR OBS */
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-bright);
        }

        /* Container Layout - Separated Floating Panels */
        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Separation between panels */
            width: 320px; /* Fixed width for consistent stream layout */
        }

        /* Advanced Glassmorphism Panel */
        .premium-panel {
            background: linear-gradient(135deg, var(--glass-bg) 0%, rgba(0, 0, 0, 0.8) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid var(--glass-highlight);
            border-right: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--dark-red);
            border-radius: 8px;
            padding: 16px 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.05);
            transform-origin: left center;
            animation: slideIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* Animated background pulse for panels */
        .premium-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 40, 40, 0.1) 0%, transparent 70%);
            z-index: 0;
            animation: breathe 4s infinite alternate;
        }

        /* Content Wrapper (keeps text above absolute background) */
        .panel-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }

        /* Typography */
        .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: -5px;
            text-shadow: 1px 1px 2px #000;
        }

        .value {
            font-family: 'Teko', sans-serif;
            font-size: 3.8rem;
            font-weight: 700;
            line-height: 1;
            margin: 0;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .sub-value {
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-left: 8px;
        }

        /* Specific Glow Colors */
        .color-safe {
            color: var(--text-bright);
            text-shadow: var(--glow-white);
        }
        
        .color-pot {
            color: var(--neon-red);
            text-shadow: var(--glow-red);
        }

        .color-streak {
            color: var(--gold-neon);
            text-shadow: var(--glow-gold);
        }

        .color-jail {
            color: var(--blood-red);
            text-shadow: 0 0 10px rgba(122, 0, 0, 0.8);
        }

        /* Multi-stat layout (for streaks) */
        .split-stat {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .split-stat .stat-block {
            display: flex;
            flex-direction: column;
        }

        .stat-divider {
            width: 1px;
            height: 50px;
            background: linear-gradient(to bottom, transparent, var(--glass-border), transparent);
            margin: 0 15px;
        }

        /* State Modifiers */
        .value.update-flash {
            animation: dataFlash 0.5s ease-out;
        }

        /* Loading / Error State */
        #status-panel {
            text-align: center;
            border-bottom-color: var(--glass-border);
        }
        
        .status-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            animation: pulseOpacity 2s infinite;
        }

        /* Keyframe Animations */
        @keyframes slideIn {
            0% { transform: translateX(-50px) scale(0.95); opacity: 0; filter: blur(5px); }
            100% { transform: translateX(0) scale(1); opacity: 1; filter: blur(0); }
        }

        @keyframes breathe {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        @keyframes dataFlash {
            0% { transform: scale(1); filter: brightness(1); }
            20% { transform: scale(1.1); filter: brightness(2); color: #fff; }
            100% { transform: scale(1); filter: brightness(1); }
        }

        @keyframes pulseOpacity {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Staggered load animation */
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }

    </style>
</head>
<body>

    <!-- Connection Status -->
    <div id="status-panel" class="premium-panel">
        <div class="panel-content">
            <div class="status-text" id="connection-status">AWAITING ENTITY CONNECTION...</div>
        </div>
    </div>

    <!-- Main Overlay Container (Hidden until connected) -->
    <div class="overlay-container" id="main-overlay" style="display: none;">
        
        <!-- Safe Bank Panel -->
        <div class="premium-panel delay-1">
            <div class="panel-content">
                <div class="label">Total Safe Bank</div>
                <div class="value color-safe" id="ov-safe">0</div>
            </div>
        </div>

        <!-- Active Pot Panel -->
        <div class="premium-panel delay-2">
            <div class="panel-content">
                <div class="label">Active Risk Pot</div>
                <div class="value color-pot" id="ov-pot">0</div>
            </div>
        </div>

        <!-- Streaks Panel (Current / Best) -->
        <div class="premium-panel delay-3">
            <div class="panel-content">
                <div class="split-stat">
                    <div class="stat-block">
                        <div class="label">Current Streak</div>
                        <div class="value color-streak" id="ov-streak-current">0</div>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-block" style="align-items: flex-end;">
                        <div class="label">Best Run</div>
                        <div class="value color-streak" style="font-size: 2.8rem; opacity: 0.8;" id="ov-streak-best">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Ransom Jail Panel -->
        <div class="premium-panel delay-4">
            <div class="panel-content">
                <div class="split-stat">
                    <div class="stat-block">
                        <div class="label">Perks in Jail</div>
                        <div class="value color-jail" id="ov-jail">0</div>
                    </div>
                    <div class="stat-block" style="justify-content: center; text-align: right;">
                        <div class="label" style="font-size: 0.6rem; color: #555;">Entity's<br>Ransom</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ==========================================================================
         JAVASCRIPT DATA BINDING & ANIMATION ENGINE
         ========================================================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // IMPORTANT: PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        let app, db;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch(e) {
            document.getElementById('connection-status').innerText = "FIREBASE CONFIGURATION MISSING";
            document.getElementById('connection-status').style.color = "var(--neon-red)";
            console.error("Firebase Init Error:", e);
        }

        // --- URL Parameter Parsing ---
        // Expects OBS browser source URL to look like: obs_overlay.html?user=StreamerName
        const urlParams = new URLSearchParams(window.location.search);
        const targetUser = urlParams.get('user');

        // --- Custom Number Tween Engine ---
        // Smoothly animates numbers counting up/down instead of snapping instantly
        class NumberTweener {
            constructor(elementId, duration = 1000) {
                this.element = document.getElementById(elementId);
                this.currentValue = 0;
                this.targetValue = 0;
                this.duration = duration;
                this.startTime = null;
                this.startValue = 0;
                this.animationFrame = null;
            }

            update(newValue) {
                if (this.targetValue === newValue) return; // No change
                
                // Trigger CSS flash animation
                this.element.classList.remove('update-flash');
                void this.element.offsetWidth; // Trigger reflow
                this.element.classList.add('update-flash');

                this.startValue = this.currentValue;
                this.targetValue = newValue;
                this.startTime = performance.now();
                
                if (this.animationFrame) cancelAnimationFrame(this.animationFrame);
                this.animationFrame = requestAnimationFrame((time) => this.tick(time));
            }

            tick(currentTime) {
                const elapsed = currentTime - this.startTime;
                const progress = Math.min(elapsed / this.duration, 1);
                
                // Ease Out Cubic function for smooth deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                this.currentValue = Math.floor(this.startValue + (this.targetValue - this.startValue) * easeOut);
                
                // Format with commas for premium look (e.g., 20,000)
                this.element.innerText = this.currentValue.toLocaleString();

                if (progress < 1) {
                    this.animationFrame = requestAnimationFrame((t) => this.tick(t));
                } else {
                    this.currentValue = this.targetValue;
                    this.element.innerText = this.targetValue.toLocaleString();
                }
            }
        }

        // Initialize Animators for each metric
        const animators = {
            safe: new NumberTweener('ov-safe', 1500),
            pot: new NumberTweener('ov-pot', 1000),
            streak: new NumberTweener('ov-streak-current', 800),
            best: new NumberTweener('ov-streak-best', 800),
            jail: new NumberTweener('ov-jail', 500)
        };

        // --- Real-time Firebase Listener Engine ---
        function initializeTracker() {
            const statusPanel = document.getElementById('status-panel');
            const mainOverlay = document.getElementById('main-overlay');

            if (!targetUser) {
                statusPanel.innerHTML = '<span style="color:var(--neon-red);">URL ERROR: NO ?user= PARAMETER FOUND</span>';
                return;
            }
            if (!db) return;

            statusPanel.innerHTML = `<span style="color:var(--gold-neon);">MONITORING: ${targetUser.toUpperCase()}</span>`;
            
            // Fade out status and fade in overlay after 2 seconds
            setTimeout(() => {
                statusPanel.style.display = 'none';
                mainOverlay.style.display = 'flex';
            }, 2000);

            // Connect to EXACT same path as website - read only.
            const docRef = doc(db, 'roulette_state', targetUser);
            
            // onSnapshot triggers instantly on load, and every time the DB changes
            onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    
                    // Route data to tweens safely (default to 0 if missing)
                    animators.safe.update(data.safeBank || 0);
                    animators.pot.update(data.currentPot || 0);
                    animators.streak.update(data.totalStreak || 0);
                    animators.best.update(data.highestStreak || 0);
                    
                    // Array length calculation for jail
                    const jailCount = data.ransomJail ? data.ransomJail.length : 0;
                    animators.jail.update(jailCount);

                } else {
                    // Document doesn't exist yet (first time player)
                    animators.safe.update(0);
                    animators.pot.update(0);
                    animators.streak.update(0);
                    animators.best.update(0);
                    animators.jail.update(0);
                }
            }, (error) => {
                console.error("Overlay Sync Error:", error);
                statusPanel.style.display = 'block';
                statusPanel.innerHTML = '<span style="color:var(--neon-red);">CONNECTION LOST TO ENTITY</span>';
            });
        }

        // Boot system
        window.addEventListener('DOMContentLoaded', initializeTracker);

    </script>
</body>
</html>
