<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette - Premium Stream Overlay</title>
    <!-- Premium Fonts: Teko for Numbers, Montserrat for Labels -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           PREMIUM CSS ARCHITECTURE - OBS TRANSPARENT SETUP
           ========================================================================== */
        :root {
            /* Premium Core Palette */
            --entity-red: #d32f2f;
            --entity-blood: #9a031e;
            --gold-ascension: #e5b824;
            --gold-glow: rgba(229, 184, 36, 0.6);
            --void-black: rgba(5, 5, 8, 0.85);
            --glass-bg: rgba(15, 10, 15, 0.7);
            --bone-white: #f0f0f5;
            --text-muted: #a0a0b5;
            --neon-streak: #00ffcc;
            --jail-blue: #4a90e2;

            /* Spacing & Sizing */
            --widget-gap: 12px;
            --border-radius: 8px;
            
            /* Typography */
            --font-ui: 'Teko', sans-serif;
            --font-label: 'Montserrat', sans-serif;
        }

        /* OBS REQUIRED: Transparent Background */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: transparent !important;
            overflow: hidden; /* No scrollbars in OBS */
            font-family: var(--font-label);
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        /* ==========================================================================
           WIDGET CONTAINER LAYOUT (Designed for Top-Right or Top-Left corner)
           ========================================================================== */
        .overlay-container {
            display: flex;
            flex-direction: column;
            gap: var(--widget-gap);
            padding: 20px;
            width: 320px;
            transform-origin: top left;
            /* Animation on load */
            animation: slideIn 1.2s cubic-bezier(0.25, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* ==========================================================================
           INDIVIDUAL STAT BLOCKS (GLASSMORPHISM EFFECT)
           ========================================================================== */
        .stat-block {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--void-black);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius);
            padding: 12px 18px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Animated Left Border Gradient */
        .stat-block::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        /* Content Formatting */
        .stat-info {
            display: flex;
            flex-direction: column;
            z-index: 2;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: -4px;
        }

        .stat-value {
            font-family: var(--font-ui);
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
            color: var(--bone-white);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: baseline;
            gap: 5px;
        }

        .stat-suffix {
            font-size: 1rem;
            color: var(--text-muted);
            font-family: var(--font-label);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* SVG Icons Background */
        .stat-icon {
            position: absolute;
            right: -10px;
            top: 50%;
            transform: translateY(-50%);
            width: 80px;
            height: 80px;
            opacity: 0.15;
            z-index: 1;
            transition: all 0.5s ease;
        }

        /* ==========================================================================
           PREMIUM THEMES PER STAT
           ========================================================================== */
        
        /* 1. Safe Bank (Gold/Premium) */
        .theme-safe {
            border-bottom: 1px solid rgba(229, 184, 36, 0.3);
        }
        .theme-safe::before { background: linear-gradient(180deg, #fff, var(--gold-ascension)); box-shadow: 0 0 15px var(--gold-ascension); }
        .theme-safe .stat-value { color: var(--gold-ascension); text-shadow: 0 0 20px rgba(229, 184, 36, 0.4); }
        .theme-safe .stat-icon { fill: var(--gold-ascension); }

        /* 2. Active Pot (Entity Red/Danger) */
        .theme-pot {
            border-bottom: 1px solid rgba(211, 47, 47, 0.3);
            background: linear-gradient(90deg, var(--void-black) 60%, rgba(154, 3, 30, 0.2) 100%);
        }
        .theme-pot::before { background: linear-gradient(180deg, #ff4d4d, var(--entity-red)); box-shadow: 0 0 15px var(--entity-red); }
        .theme-pot .stat-value { color: #ff4d4d; animation: pulseGlow 2s infinite; }
        .theme-pot .stat-icon { fill: var(--entity-red); }

        /* 3. Current Streak (Cyan/Neon Speed) */
        .theme-streak {
            border-bottom: 1px solid rgba(0, 255, 204, 0.2);
        }
        .theme-streak::before { background: linear-gradient(180deg, #fff, var(--neon-streak)); box-shadow: 0 0 15px var(--neon-streak); }
        .theme-streak .stat-value { color: var(--neon-streak); text-shadow: 0 0 15px rgba(0, 255, 204, 0.5); }
        .theme-streak .stat-icon { fill: var(--neon-streak); }

        /* 4. Highest Streak (Purple/Legendary) */
        .theme-high {
            border-bottom: 1px solid rgba(170, 0, 255, 0.2);
        }
        .theme-high::before { background: linear-gradient(180deg, #e0b3ff, #aa00ff); box-shadow: 0 0 15px #aa00ff; }
        .theme-high .stat-value { color: #e0b3ff; }
        .theme-high .stat-icon { fill: #aa00ff; }

        /* 5. Ransom Jail (Blue/Chains) */
        .theme-jail {
            border-bottom: 1px solid rgba(74, 144, 226, 0.2);
            opacity: 0.9;
        }
        .theme-jail::before { background: linear-gradient(180deg, #fff, var(--jail-blue)); box-shadow: 0 0 10px var(--jail-blue); }
        .theme-jail .stat-value { color: var(--jail-blue); }
        .theme-jail .stat-icon { fill: var(--jail-blue); }

        /* ==========================================================================
           ANIMATIONS & KEYFRAMES
           ========================================================================== */
        @keyframes slideIn {
            0% { transform: translateX(-50px); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(211,47,47,0.5); }
            50% { text-shadow: 0 0 25px rgba(211,47,47,0.9), 0 0 40px rgba(211,47,47,0.4); }
        }

        /* Update trigger animation for when numbers change */
        .update-flash {
            animation: flashHighlight 0.8s ease-out;
        }
        @keyframes flashHighlight {
            0% { background: rgba(255, 255, 255, 0.3); transform: scale(1.02); }
            100% { background: transparent; transform: scale(1); }
        }

        /* Player Name Banner */
        .player-banner {
            background: linear-gradient(90deg, var(--entity-blood) 0%, rgba(0,0,0,0) 100%);
            padding: 4px 12px;
            border-left: 4px solid var(--entity-red);
            font-size: 0.85rem;
            color: #fff;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 5px;
            border-radius: 2px;
            display: inline-block;
            text-shadow: 0 2px 4px #000;
        }
    </style>
</head>
<body>

    <div class="overlay-container" id="overlay">
        <!-- Identifying the Streamer -->
        <div class="player-banner" id="streamer-name">LOADING...</div>

        <!-- 1. Safe Points (The Bank) -->
        <div class="stat-block theme-safe" id="block-safe">
            <div class="stat-info">
                <span class="stat-label">Safe Bank</span>
                <div class="stat-value"><span id="val-safe">0</span> <span class="stat-suffix">PTS</span></div>
            </div>
            <!-- SVG Vault Icon -->
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        </div>

        <!-- 2. Active Pot (The Risk) -->
        <div class="stat-block theme-pot" id="block-pot">
            <div class="stat-info">
                <span class="stat-label">Active Pot</span>
                <div class="stat-value"><span id="val-pot">0</span> <span class="stat-suffix">PTS</span></div>
            </div>
            <!-- SVG Fire/Risk Icon -->
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M17.5 12.5c0 3.03-2.47 5.5-5.5 5.5s-5.5-2.47-5.5-5.5c0-1.24.41-2.38 1.11-3.32L12 2l4.39 7.18c.7 1.04 1.11 2.08 1.11 3.32zM12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zm0-2c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
        </div>

        <!-- 3. Current Universal Streak -->
        <div class="stat-block theme-streak" id="block-streak">
            <div class="stat-info">
                <span class="stat-label">Current Streak</span>
                <div class="stat-value"><span id="val-streak">0</span></div>
            </div>
            <!-- SVG Lightning Icon -->
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        </div>

        <!-- 4. Highest Streak -->
        <div class="stat-block theme-high" id="block-high">
            <div class="stat-info">
                <span class="stat-label">Highest Streak</span>
                <div class="stat-value"><span id="val-high">0</span></div>
            </div>
            <!-- SVG Crown/Star Icon -->
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
        </div>

        <!-- 5. Perks in Ransom Jail -->
        <div class="stat-block theme-jail" id="block-jail">
            <div class="stat-info">
                <span class="stat-label">Perks In Jail</span>
                <div class="stat-value"><span id="val-jail">0</span></div>
            </div>
            <!-- SVG Lock/Jail Icon -->
            <svg class="stat-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
        </div>
    </div>

    <!-- ==========================================================================
         JAVASCRIPT & FIREBASE LOGIC
         ========================================================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // IMPORT 'onSnapshot' to listen to live changes without refreshing
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. PASTE YOUR EXACT FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. EXTRACT USERNAME FROM THE OBS BROWSER URL
        // Example: https://yourdomain.com/roulette_overlay.html?user=YatoTheMad
        const urlParams = new URLSearchParams(window.location.search);
        const targetUser = urlParams.get('user');

        if (!targetUser) {
            document.getElementById('streamer-name').innerText = "ERROR: NO USER SET";
            document.getElementById('streamer-name').style.backgroundColor = "red";
            console.error("Missing ?user= param in URL");
        } else {
            document.getElementById('streamer-name').innerText = targetUser;
            startLiveTracker(targetUser);
        }

        // 3. PREMIUM NUMBER ANIMATION ENGINE
        // This makes numbers count up smoothly instead of instantly changing
        class AnimatedNumber {
            constructor(elementId) {
                this.element = document.getElementById(elementId);
                this.blockElement = document.getElementById(`block-${elementId.replace('val-', '')}`);
                this.currentValue = 0;
            }

            update(newValue) {
                if (this.currentValue === newValue) return; // No change
                
                // Trigger flash CSS animation on the parent block
                if (this.blockElement) {
                    this.blockElement.classList.remove('update-flash');
                    void this.blockElement.offsetWidth; // Trigger reflow
                    this.blockElement.classList.add('update-flash');
                }

                // Animate the number
                const start = this.currentValue;
                const end = newValue;
                const duration = 1000; // 1 second animation
                const startTime = performance.now();

                const animate = (currentTime) => {
                    const elapsedTime = currentTime - startTime;
                    const progress = Math.min(elapsedTime / duration, 1);
                    
                    // Ease-out cubic formula for smooth slowdown at the end
                    const easeProgress = 1 - Math.pow(1 - progress, 3); 
                    const currentStep = Math.floor(start + (end - start) * easeProgress);
                    
                    // Format with commas (e.g., 20,000)
                    this.element.innerText = currentStep.toLocaleString();

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        this.element.innerText = end.toLocaleString();
                        this.currentValue = end;
                    }
                };
                requestAnimationFrame(animate);
            }
        }

        // Initialize the animators
        const animators = {
            safe: new AnimatedNumber('val-safe'),
            pot: new AnimatedNumber('val-pot'),
            streak: new AnimatedNumber('val-streak'),
            high: new AnimatedNumber('val-high'),
            jail: new AnimatedNumber('val-jail')
        };

        // 4. THE LIVE LISTENER (THE MAGIC)
        // This attaches to the specific user's document. Every time they click "Win", "Lose",
        // or "Cash Out" on the main website, this overlay instantly updates inside OBS.
        function startLiveTracker(username) {
            const docRef = doc(db, 'roulette_state', username);
            
            // onSnapshot triggers immediately once, and then again every time the DB changes
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // Feed new data to the Animation Engine
                    animators.safe.update(data.safeBank || 0);
                    animators.pot.update(data.currentPot || 0);
                    animators.streak.update(data.totalStreak || 0);
                    animators.high.update(data.highestStreak || 0);
                    
                    // Jail is an array of strings, we just want the length
                    const jailCount = (data.ransomJail) ? data.ransomJail.length : 0;
                    animators.jail.update(jailCount);
                    
                    // Optional visual tweak: Dim the pot if it's 0 to reduce clutter
                    if ((data.currentPot || 0) === 0) {
                        document.getElementById('block-pot').style.opacity = '0.5';
                    } else {
                        document.getElementById('block-pot').style.opacity = '1';
                    }

                } else {
                    console.warn("No data found for this streamer yet. Waiting for them to play.");
                }
            }, (error) => {
                console.error("Error listening to Firebase:", error);
                document.getElementById('streamer-name').innerText = "CONNECTION LOST";
                document.getElementById('streamer-name').style.backgroundColor = "red";
            });
        }
    </script>
</body>
</html>
