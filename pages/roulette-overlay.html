<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette Overlay</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;0,900;1,900&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Deep Obsidian Glass */
            --bg-glass: rgba(8, 8, 12, 0.85);
            --bg-glass-light: rgba(20, 20, 28, 0.95);
            
            /* Hyper-Saturated Neon Palette */
            --gold-glow: #ffc400; --gold-dark: #997300;
            --blood-glow: #ff003c; --blood-dark: #8a0020;
            --ethereal-glow: #00f0ff; --ethereal-dark: #007a8a;
            --diamond-glow: #d4e8ff; --diamond-dark: #5a7399;
            --void-glow: #ae00ff; --void-dark: #5e008a;

            --font-ui: 'Teko', sans-serif;
            --font-data: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: transparent !important; 
            overflow: hidden; 
            font-family: var(--font-data);
            -webkit-font-smoothing: antialiased;
        }

        #perspective-wrapper {
            position: absolute; top: 0; right: 0;
            width: 100%; height: 100%;
            display: flex; justify-content: flex-end;
            padding: 30px 40px 0 0; 
        }

        /* GRID MANAGER: Stacks Intro and Stats perfectly on top of each other */
        #view-manager {
            display: grid;
            width: 420px;
        }

        .view-layer {
            grid-area: 1 / 1; /* Forces both views into the exact same spatial grid */
            width: 100%;
            display: flex;
            flex-direction: column;
            
            /* Advanced Futuristic Transition */
            opacity: 0;
            transform: translateX(80px) scale(0.9);
            filter: blur(15px);
            pointer-events: none;
            transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        filter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .view-active {
            opacity: 1;
            transform: translateX(0) scale(1);
            filter: blur(0);
            pointer-events: auto;
        }

        #overlay-container {
            display: flex; flex-direction: column; gap: 26px; 
            width: 100%; 
        }

        .stat-block-wrapper {
            position: relative;
            border-radius: 20px;
            padding: 6px; 
            background: rgba(0,0,0,0.9);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 25px var(--theme-dark);
            
            /* Independent Floating */
            animation: independentFloat 6s ease-in-out infinite alternate forwards;
        }

        /* Staggered Float Animations & Theme Assignments */
        #wrap-safe   { animation-delay: 0.1s; --theme-color: var(--gold-glow); --theme-dark: var(--gold-dark); }
        #wrap-pot    { animation-delay: 1.2s; --theme-color: var(--blood-glow); --theme-dark: var(--blood-dark); }
        #wrap-streak { animation-delay: 2.3s; --theme-color: var(--ethereal-glow); --theme-dark: var(--ethereal-dark); }
        #wrap-best   { animation-delay: 3.4s; --theme-color: var(--diamond-glow); --theme-dark: var(--diamond-dark); }
        #wrap-jail   { animation-delay: 4.5s; --theme-color: var(--void-glow); --theme-dark: var(--void-dark); }

        @keyframes independentFloat {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-8px); }
        }

        /* THICK Continuous Spinning Conic Border */
        .spinning-border {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(
                transparent 0deg, 
                transparent 120deg, 
                var(--theme-dark) 220deg, 
                var(--theme-color) 360deg
            );
            animation: spin 2.5s linear infinite; 
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Inner Glass Panel */
        .stat-block {
            position: relative;
            background: linear-gradient(135deg, var(--bg-glass) 0%, var(--bg-glass-light) 100%);
            border-radius: 14px; 
            padding: 14px 28px; 
            display: flex; flex-direction: column; justify-content: center;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 2;
            overflow: hidden;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
            transition: background 0.3s ease;
        }

        .stat-block::after {
            content: ''; position: absolute; top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transform: skewX(-25deg);
            z-index: 1;
            animation: glossSweep 7s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }
        @keyframes glossSweep {
            0% { left: -150%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .stat-label {
            font-family: var(--font-ui); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 4px;
            margin-bottom: -12px; font-weight: 700; z-index: 4; position: relative;
            display: flex; justify-content: space-between; align-items: flex-end;
            color: #ffffff;
            text-shadow: 0 4px 6px rgba(0,0,0,1), 0 0 15px var(--theme-color);
        }

        .stat-label span {
            font-size: 1.35rem; opacity: 0.9; color: var(--theme-color);
            text-shadow: 0 2px 4px rgba(0,0,0,1);
        }

        .stat-value {
            font-family: var(--font-data); 
            font-size: 5rem; 
            font-weight: 900; font-style: italic; 
            line-height: 1.05; letter-spacing: 1px; z-index: 4; position: relative;
            color: #ffffff;
            -webkit-text-stroke: 2px #000000;
            text-shadow: 
                0 0 20px var(--theme-color), 
                0 0 40px var(--theme-color), 
                0 6px 0px #000000, 
                0 15px 25px rgba(0,0,0,0.9);
            transform-origin: left center;
        }

        .stat-subtext {
            font-family: var(--font-ui); font-size: 1.5rem; letter-spacing: 3px;
            margin-top: -4px; font-weight: 600; z-index: 4; position: relative;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,1);
        }

        .multi-high {
            color: #FFD700 !important;
            animation: dangerPulse 0.6s infinite alternate !important;
        }
        @keyframes dangerPulse {
            0% { text-shadow: 0 0 10px #ffaa00, 0 2px 4px rgba(0,0,0,1); transform: scale(1); }
            100% { text-shadow: 0 0 30px #ffaa00, 0 0 60px #ffaa00, 0 2px 4px rgba(0,0,0,1); transform: scale(1.08) translateX(10px); }
        }

        .update-flash-container {
            animation: containerFlash 0.6s ease-out forwards;
        }
        @keyframes containerFlash {
            0% { background: var(--bg-glass); box-shadow: inset 0 0 40px rgba(0,0,0,0.9); }
            20% { background: rgba(255,255,255,0.2); box-shadow: inset 0 0 150px var(--theme-color); }
            100% { background: var(--bg-glass); box-shadow: inset 0 0 40px rgba(0,0,0,0.9); }
        }

        .update-pop-text {
            animation: textPopHit 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes textPopHit {
            0% { transform: scale(1); filter: brightness(1); }
            30% { transform: scale(1.2) rotate(-2deg); filter: brightness(2) drop-shadow(0 0 30px #fff); color: #fff; -webkit-text-stroke: 2px var(--theme-color); }
            100% { transform: scale(1) rotate(0deg); filter: brightness(1); color: #ffffff; -webkit-text-stroke: 2px #000000; }
        }

        #connection-status {
            font-family: var(--font-ui); font-size: 1.8rem; color: #ffffff;
            text-shadow: 0 3px 6px rgba(0,0,0,1);
            text-align: right; text-transform: uppercase; letter-spacing: 6px;
            display: flex; justify-content: flex-end; align-items: center; gap: 16px;
            padding-right: 5px; margin-bottom: 26px; font-weight: 700;
        }
        .status-dot { width: 16px; height: 16px; border-radius: 50%; background: #ff003c; box-shadow: 0 0 20px #ff003c, 0 0 40px #ff003c; border: 2px solid #000; }
        .status-dot.connected { background: #00ff66; box-shadow: 0 0 20px #00ff66, 0 0 40px #00ff66; animation: statusBeat 1s infinite alternate; }
        @keyframes statusBeat { 0% { opacity: 1; transform: scale(1.2); } 100% { opacity: 0.6; transform: scale(1); } }

        /* ========================================================
           INTRO VIEW SPECIFIC STYLES 
           ======================================================== */
        .intro-wrapper {
            --theme-color: var(--blood-glow); 
            --theme-dark: var(--blood-dark);
            height: 100%; /* Inherits full height of the grid cell dictated by stats */
            width: 100%;
        }

        .intro-spin {
            /* Dual colored spin specifically for the massive intro box */
            background: conic-gradient(
                transparent 0deg, 
                var(--gold-dark) 90deg, 
                var(--gold-glow) 180deg, 
                transparent 180deg, 
                var(--blood-dark) 270deg, 
                var(--blood-glow) 360deg
            );
            animation: spin 2s linear infinite; 
        }

        .intro-block {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .intro-subtitle {
            font-family: var(--font-ui); font-size: 1.8rem; letter-spacing: 8px; 
            color: var(--theme-color); margin-bottom: 10px; font-weight: 700;
            text-shadow: 0 0 10px var(--theme-color), 0 2px 4px rgba(0,0,0,1);
        }

        .intro-title {
            font-family: var(--font-data); font-size: 4.5rem; font-weight: 900; font-style: italic; 
            line-height: 0.95; color: #fff; -webkit-text-stroke: 2px #000; 
            text-shadow: 0 0 20px var(--theme-color), 0 10px 25px rgba(0,0,0,0.9); 
            margin-bottom: 25px;
        }

        .intro-target {
            font-family: var(--font-ui); font-size: 2.2rem; color: #fff; letter-spacing: 3px;
            background: rgba(0,0,0,0.7); padding: 5px 25px; border-radius: 8px; 
            border: 1px solid var(--theme-color); display: inline-block;
            box-shadow: 0 0 20px rgba(255,0,60,0.3);
        }
    </style>
</head>
<body>

    <div id="perspective-wrapper">
        <div id="view-manager">
            
            <!-- INTRO VIEW (3 Seconds) -->
            <div id="intro-view" class="view-layer view-active">
                <div class="stat-block-wrapper intro-wrapper">
                    <div class="spinning-border intro-spin"></div>
                    <div class="stat-block intro-block">
                        <div class="intro-subtitle">CHALLENGE ACTIVE</div>
                        <div class="intro-title">ENTITY'S<br>ROULETTE</div>
                        <div class="intro-target" id="intro-target-name">AWAITING TARGET</div>
                    </div>
                </div>
            </div>

            <!-- STATS / PROGRESS VIEW (5 Seconds) -->
            <div id="stats-view" class="view-layer">
                
                <div id="connection-status">
                    <span id="streamer-name-display">ESTABLISHING UPLINK...</span>
                    <div class="status-dot" id="dot-status"></div>
                </div>

                <div id="overlay-container">
                    
                    <!-- Block 1 -->
                    <div class="stat-block-wrapper" id="wrap-safe">
                        <div class="spinning-border"></div>
                        <div class="stat-block" id="box-safe">
                            <div class="stat-label">Safe Bank <span>PTS</span></div>
                            <div class="stat-value" id="val-safe">0</div>
                        </div>
                    </div>

                    <!-- Block 2 -->
                    <div class="stat-block-wrapper" id="wrap-pot">
                        <div class="spinning-border"></div>
                        <div class="stat-block" id="box-pot">
                            <div class="stat-label">Active Pot <span>RISK</span></div>
                            <div class="stat-value" id="val-pot">0</div>
                            <div class="stat-subtext" id="sub-multiplier">MULTI: 1.0x</div>
                        </div>
                    </div>

                    <!-- Block 3 -->
                    <div class="stat-block-wrapper" id="wrap-streak">
                        <div class="spinning-border"></div>
                        <div class="stat-block" id="box-streak">
                            <div class="stat-label">Global Streak <span>WINS</span></div>
                            <div class="stat-value" id="val-streak">0</div>
                        </div>
                    </div>

                    <!-- Block 4 -->
                    <div class="stat-block-wrapper" id="wrap-best">
                        <div class="spinning-border"></div>
                        <div class="stat-block" id="box-best">
                            <div class="stat-label">Highest Streak <span>RECORD</span></div>
                            <div class="stat-value" id="val-best">0</div>
                        </div>
                    </div>

                    <!-- Block 5 -->
                    <div class="stat-block-wrapper" id="wrap-jail">
                        <div class="spinning-border"></div>
                        <div class="stat-block" id="box-jail">
                            <div class="stat-label">Perks in Jail <span>LOCKED</span></div>
                            <div class="stat-value" id="val-jail">0</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            // Your config here
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const streamerUsername = urlParams.get('user');
        
        const statusText = document.getElementById('streamer-name-display');
        const statusDot = document.getElementById('dot-status');
        const introTargetName = document.getElementById('intro-target-name');

        // ==========================================
        // UI VIEW LOOP LOGIC (Intro vs Stats)
        // ==========================================
        const introView = document.getElementById('intro-view');
        const statsView = document.getElementById('stats-view');
        let showingIntro = true;

        function runDisplayLoop() {
            if (showingIntro) {
                // Show Intro, Hide Stats
                introView.classList.add('view-active');
                statsView.classList.remove('view-active');
                
                // Next transition in 3 Seconds
                setTimeout(runDisplayLoop, 3000); 
            } else {
                // Show Stats, Hide Intro
                statsView.classList.add('view-active');
                introView.classList.remove('view-active');
                
                // Next transition in 5 Seconds
                setTimeout(runDisplayLoop, 5000); 
            }
            showingIntro = !showingIntro;
        }

        // Start the infinite loop immediately
        runDisplayLoop();

        // ==========================================
        // FIREBASE DATA LOGIC 
        // ==========================================
        if (!streamerUsername) {
            statusText.innerText = "NO TARGET ASSIGNED";
            statusText.style.color = "var(--blood-glow)";
            introTargetName.innerText = "NO TARGET ASSIGNED";
        } else {
            const formattedName = streamerUsername.toUpperCase();
            statusText.innerText = `UPLINK: ${formattedName}`;
            introTargetName.innerText = `TARGET: ${formattedName}`;
            
            function slotMachineRoll(obj, start, end, duration) {
                let startTimestamp = null;
                
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    
                    const easeOut = 1 - Math.pow(1 - progress, 4);
                    const current = Math.floor(start + (end - start) * easeOut);
                    
                    if (progress < 0.8) {
                        obj.style.textShadow = `0 10px 10px rgba(255,255,255,0.5), 0 -10px 10px rgba(255,255,255,0.5)`;
                    } else {
                        obj.style.textShadow = ''; 
                    }

                    obj.innerText = current.toLocaleString();
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        obj.innerText = end.toLocaleString();
                        obj.style.textShadow = ''; 
                    }
                };
                window.requestAnimationFrame(step);
            }

            const previousState = {
                safeBank: null, currentPot: null, totalStreak: null, highestStreak: null, ransomJail: null
            };

            function triggerPremiumUpdate(elementId, boxId, newValue, stateKey) {
                const el = document.getElementById(elementId);
                const box = document.getElementById(boxId);
                
                if (previousState[stateKey] !== newValue) {
                    const oldValue = previousState[stateKey] === null ? 0 : previousState[stateKey];
                    
                    el.classList.remove('update-pop-text');
                    box.classList.remove('update-flash-container');
                    void box.offsetWidth; 
                    
                    box.classList.add('update-flash-container');
                    el.classList.add('update-pop-text');
                    
                    slotMachineRoll(el, oldValue, newValue, 600);
                    
                    previousState[stateKey] = newValue;
                }
            }
            
            const userRef = doc(db, 'roulette_state', streamerUsername);
            
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    statusDot.classList.add('connected');
                    
                    const data = docSnap.data();
                    const safeBank = data.safeBank || 0;
                    const currentPot = data.currentPot || 0;
                    const totalStreak = data.totalStreak || 0;
                    const highestStreak = data.highestStreak || 0;
                    
                    const currentLocalStreak = data.currentLocalStreak || 0;
                    const multiplier = 1.0 + (currentLocalStreak * 0.5);
                    const multiEl = document.getElementById('sub-multiplier');
                    multiEl.innerText = `MULTI: ${multiplier.toFixed(1)}x`;
                    
                    if (multiplier >= 2.0) {
                        multiEl.classList.add('multi-high');
                    } else {
                        multiEl.classList.remove('multi-high');
                    }

                    const jailArray = data.ransomJail || [];
                    const perksInJail = jailArray.length;

                    triggerPremiumUpdate('val-safe', 'box-safe', safeBank, 'safeBank');
                    triggerPremiumUpdate('val-pot', 'box-pot', currentPot, 'currentPot');
                    triggerPremiumUpdate('val-streak', 'box-streak', totalStreak, 'totalStreak');
                    triggerPremiumUpdate('val-best', 'box-best', highestStreak, 'highestStreak');
                    triggerPremiumUpdate('val-jail', 'box-jail', perksInJail, 'ransomJail');

                } else {
                    statusText.innerText = "AWAITING TARGET DATA...";
                    statusDot.classList.remove('connected');
                }
            }, (error) => {
                statusText.innerText = "UPLINK SEVERED";
                statusDot.classList.remove('connected');
            });
        }
    </script>
</body>
</html>
