<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette </title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;0,900;1,900&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Solid Dark Tech Backgrounds (No GPU-heavy blurs) */
            --bg-solid: rgba(15, 15, 20, 0.98);
            
            /* Neon Palette */
            --gold-glow: #ffc400; --gold-dark: #997300;
            --blood-glow: #ff003c; --blood-dark: #8a0020;
            --ethereal-glow: #00f0ff; --ethereal-dark: #007a8a;
            --diamond-glow: #d4e8ff; --diamond-dark: #5a7399;
            --void-glow: #ae00ff; --void-dark: #5e008a;
            
            /* Intro Palette */
            --intro-glow: #ff003c; --intro-dark: #7a0055;

            --font-ui: 'Teko', sans-serif;
            --font-data: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: transparent !important; 
            overflow: hidden; 
            font-family: var(--font-data);
            -webkit-font-smoothing: antialiased;
        }

        #perspective-wrapper {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
        }

        /* 
         =============================================
         GPU-OPTIMIZED CYCLER
         =============================================
        */
        .view-container {
            position: absolute; top: 30px; right: 40px;
            width: 420px; 
            display: flex; flex-direction: column; gap: 20px;
            pointer-events: auto;
            /* Only animating opacity and transform guarantees no GPU repaints */
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: opacity, transform;
            transform: translateZ(0);
        }

        .view-hidden {
            opacity: 0; transform: translateY(-15px) scale(0.97); pointer-events: none;
        }
        .view-active {
            opacity: 1; transform: translateY(0) scale(1); pointer-events: auto;
        }

        /* 
         =============================================
         ULTRA-LITE E-SPORTS STAT BLOCKS
         =============================================
        */
        .stat-block {
            position: relative;
            background: var(--bg-solid);
            border-radius: 8px; /* Sharper, cleaner edges */
            border: 2px solid rgba(255,255,255,0.05);
            /* Static premium left-border instead of spinning gradients */
            border-left: 6px solid var(--theme-color);
            padding: 12px 24px; 
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6); /* Single static shadow */
            overflow: hidden;
            
            /* Staggered Boot */
            opacity: 0;
            animation: slideInBoot 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
            transform: translateZ(0);
        }

        #wrap-intro  { --theme-color: var(--intro-glow); padding: 50px 20px; text-align: center; align-items: center; border-left: 8px solid var(--theme-color); }
        #wrap-safe   { animation-delay: 0.05s; --theme-color: var(--gold-glow); }
        #wrap-pot    { animation-delay: 0.10s; --theme-color: var(--blood-glow); }
        #wrap-streak { animation-delay: 0.15s; --theme-color: var(--ethereal-glow); }
        #wrap-best   { animation-delay: 0.20s; --theme-color: var(--diamond-glow); }
        #wrap-jail   { animation-delay: 0.25s; --theme-color: var(--void-glow); }

        @keyframes slideInBoot {
            0% { opacity: 0; transform: translateX(30px); }
            100% { opacity: 1; transform: translateX(0); }
        }

        /* 
         =============================================
         CHEAP HARDWARE ACCELERATED FLASH ANIMATION
         =============================================
        */
        /* The flash is just a white overlay that fades out. Zero GPU calculations. */
        .stat-block::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.25);
            opacity: 0; pointer-events: none;
            will-change: opacity;
        }
        .update-flash-container::after {
            animation: pureFade 0.6s ease-out forwards;
        }
        @keyframes pureFade {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 
         =============================================
         TYPOGRAPHY (Static Shadows Only)
         =============================================
        */
        .stat-label {
            font-family: var(--font-ui); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 4px;
            margin-bottom: -12px; font-weight: 700; z-index: 4; position: relative;
            display: flex; justify-content: space-between; align-items: flex-end;
            color: #ffffff; text-shadow: 2px 2px 0px rgba(0,0,0,1);
        }
        .stat-label span { font-size: 1.35rem; opacity: 0.9; color: var(--theme-color); }

        .stat-value {
            font-family: var(--font-data); font-size: 5.2rem; font-weight: 900; font-style: italic; 
            line-height: 1.05; letter-spacing: 1px; z-index: 4; position: relative;
            color: #ffffff; -webkit-text-stroke: 2px #000000; 
            /* Hard static shadow, no blur radius to calculate */
            text-shadow: 4px 4px 0px rgba(0,0,0,1);
            transform-origin: left center;
            will-change: transform;
        }

        .stat-subtext {
            font-family: var(--font-ui); font-size: 1.5rem; letter-spacing: 3px;
            margin-top: -4px; font-weight: 600; z-index: 4; position: relative; color: #ffffff;
        }

        /* Pure Transform Animations for text (Zero Drop-Shadow rendering) */
        .update-pop-text { 
            animation: purePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
        }
        @keyframes purePop {
            0% { transform: scale(1); }
            30% { transform: scale(1.15) rotate(-2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .multi-high {
            color: #FFD700 !important;
            animation: dangerScale 0.6s infinite alternate !important;
            will-change: transform;
        }
        @keyframes dangerScale {
            0% { transform: scale(1); }
            100% { transform: scale(1.08) translateX(5px); }
        }

        /* 
         =============================================
         INTRO CARD SPECIFICS
         =============================================
        */
        .intro-badge {
            font-family: var(--font-ui); font-size: 1.3rem; letter-spacing: 5px;
            color: #fff; background: rgba(0,0,0,0.8);
            padding: 6px 20px; border-radius: 4px; border: 1px solid var(--theme-color);
            margin-bottom: 25px; font-weight: 700; z-index: 4; position: relative;
        }

        .intro-title {
            font-family: var(--font-ui); font-size: 5.5rem; font-weight: 900;
            line-height: 0.9; color: #ffffff; -webkit-text-stroke: 2px #000000;
            text-shadow: 4px 4px 0px rgba(0,0,0,1);
            margin-bottom: 15px; text-transform: uppercase; z-index: 4; position: relative;
            animation: introScale 2s infinite alternate;
            will-change: transform;
        }
        @keyframes introScale {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }

        .intro-subtitle {
            font-family: var(--font-data); font-size: 1.1rem; font-weight: 700;
            letter-spacing: 8px; color: #fff; text-transform: uppercase;
            z-index: 4; position: relative; text-shadow: 2px 2px 0px rgba(0,0,0,1);
        }

        /* 
         =============================================
         CONNECTION STATUS
         =============================================
        */
        #connection-status {
            font-family: var(--font-ui); font-size: 1.8rem; color: #ffffff; text-shadow: 2px 2px 0px rgba(0,0,0,1);
            text-align: right; text-transform: uppercase; letter-spacing: 6px;
            display: flex; justify-content: flex-end; align-items: center; gap: 16px;
            padding-right: 5px; font-weight: 700; margin-bottom: 5px;
        }

        .status-dot { width: 16px; height: 16px; border-radius: 50%; background: #ff003c; border: 2px solid #000; will-change: opacity; }
        .status-dot.connected { background: #00ff66; animation: statusBeat 1s infinite alternate; }
        @keyframes statusBeat { 0% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

    <div id="perspective-wrapper">
        
        <!-- =================== INTRO SHOWCASE =================== -->
        <div id="intro-container" class="view-container view-hidden">
            <div class="stat-block" id="wrap-intro">
                <div class="intro-badge">CHALLENGE SHOWCASE</div>
                <div class="intro-title">Entity's<br>Roulette</div>
                <div class="intro-subtitle">Survive The Odds</div>
            </div>
        </div>

        <!-- =================== PROGRESS GRIDS =================== -->
        <div id="progress-container" class="view-container view-hidden">
            
            <div id="connection-status">
                <span id="streamer-name-display">ESTABLISHING UPLINK...</span>
                <div class="status-dot" id="dot-status"></div>
            </div>

            <div class="stat-block" id="wrap-safe">
                <div class="stat-label">Safe Bank <span>PTS</span></div>
                <div class="stat-value" id="val-safe">0</div>
            </div>

            <div class="stat-block" id="wrap-pot">
                <div class="stat-label">Active Pot <span>RISK</span></div>
                <div class="stat-value" id="val-pot">0</div>
                <div class="stat-subtext" id="sub-multiplier">MULTI: 1.0x</div>
            </div>

            <div class="stat-block" id="wrap-streak">
                <div class="stat-label">Global Streak <span>WINS</span></div>
                <div class="stat-value" id="val-streak">0</div>
            </div>

            <div class="stat-block" id="wrap-best">
                <div class="stat-label">Highest Streak <span>RECORD</span></div>
                <div class="stat-value" id="val-best">0</div>
            </div>

            <div class="stat-block" id="wrap-jail">
                <div class="stat-label">Perks in Jail <span>LOCKED</span></div>
                <div class="stat-value" id="val-jail">0</div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const introView = document.getElementById('intro-container');
        const progressView = document.getElementById('progress-container');

        // Loop execution
        function executeDisplayLoop() {
            introView.classList.remove('view-hidden');
            introView.classList.add('view-active');
            
            progressView.classList.remove('view-active');
            progressView.classList.add('view-hidden');

            setTimeout(() => {
                introView.classList.remove('view-active');
                introView.classList.add('view-hidden');
                
                progressView.classList.remove('view-hidden');
                progressView.classList.add('view-active');

                setTimeout(executeDisplayLoop, 10000); // Back to intro after 10s

            }, 4000); // Keep intro on screen for 4s
        }
        executeDisplayLoop();

        const firebaseConfig = {
            // Your config here
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const streamerUsername = urlParams.get('user');
        
        const statusText = document.getElementById('streamer-name-display');
        const statusDot = document.getElementById('dot-status');

        if (!streamerUsername) {
            statusText.innerText = "NO TARGET ASSIGNED";
            statusText.style.color = "var(--blood-glow)";
        } else {
            statusText.innerText = `UPLINK: ${streamerUsername.toUpperCase()}`;
            
            // Ultra-lightweight roll calculation
            function slotMachineRoll(obj, start, end, duration) {
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);
                    const current = Math.floor(start + (end - start) * easeOut);
                    
                    obj.innerText = current.toLocaleString();
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        obj.innerText = end.toLocaleString();
                    }
                };
                window.requestAnimationFrame(step);
            }

            const previousState = { safeBank: null, currentPot: null, totalStreak: null, highestStreak: null, ransomJail: null };

            function triggerLiteUpdate(elementId, boxId, newValue, stateKey) {
                const el = document.getElementById(elementId);
                const box = document.getElementById(boxId);
                
                if (previousState[stateKey] !== newValue) {
                    const oldValue = previousState[stateKey] === null ? 0 : previousState[stateKey];
                    
                    // Reset CSS animations via DOM reflow
                    el.classList.remove('update-pop-text');
                    box.classList.remove('update-flash-container');
                    void box.offsetWidth; 
                    
                    box.classList.add('update-flash-container');
                    el.classList.add('update-pop-text');
                    
                    slotMachineRoll(el, oldValue, newValue, 500);
                    previousState[stateKey] = newValue;
                }
            }

            const userRef = doc(db, 'roulette_state', streamerUsername);
            
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    statusDot.classList.add('connected');
                    const data = docSnap.data();
                    
                    const multiplier = 1.0 + ((data.currentLocalStreak || 0) * 0.5);
                    const multiEl = document.getElementById('sub-multiplier');
                    multiEl.innerText = `MULTI: ${multiplier.toFixed(1)}x`;
                    
                    if (multiplier >= 2.0) { multiEl.classList.add('multi-high'); } 
                    else { multiEl.classList.remove('multi-high'); }

                    triggerLiteUpdate('val-safe', 'wrap-safe', data.safeBank || 0, 'safeBank');
                    triggerLiteUpdate('val-pot', 'wrap-pot', data.currentPot || 0, 'currentPot');
                    triggerLiteUpdate('val-streak', 'wrap-streak', data.totalStreak || 0, 'totalStreak');
                    triggerLiteUpdate('val-best', 'wrap-best', data.highestStreak || 0, 'highestStreak');
                    triggerLiteUpdate('val-jail', 'wrap-jail', (data.ransomJail || []).length, 'ransomJail');

                } else {
                    statusText.innerText = "AWAITING TARGET DATA...";
                    statusDot.classList.remove('connected');
                }
            }, (error) => {
                statusText.innerText = "UPLINK SEVERED";
                statusDot.classList.remove('connected');
            });
        }
    </script>
</body>
</html>
