<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette - Premium Stream Overlay</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           PREMIUM CSS ARCHITECTURE
           ========================================================================== */
        :root {
            /* Core Colors */
            --bg-glass: rgba(8, 8, 12, 0.65);
            --bg-glass-hover: rgba(15, 15, 20, 0.85);
            --border-glass: rgba(255, 255, 255, 0.08);
            
            /* Thematic Accents */
            --entity-blood: #ff003c;
            --entity-blood-glow: rgba(255, 0, 60, 0.7);
            
            --safe-gold: #ffd700;
            --safe-gold-glow: rgba(255, 215, 0, 0.7);
            
            --ethereal-streak: #00f0ff;
            --ethereal-streak-glow: rgba(0, 240, 255, 0.7);

            --jail-purple: #9d00ff;
            --jail-purple-glow: rgba(157, 0, 255, 0.7);

            --text-main: #ffffff;
            --text-muted: #8a8a9e;

            /* Typography */
            --font-ui: 'Teko', sans-serif;
            --font-data: 'Montserrat', sans-serif;

            /* Animations */
            --transition-smooth: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* --------------------------------------------------------------------------
           BASE SETUP (Transparent for OBS)
           -------------------------------------------------------------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            /* TRULY TRANSPARENT FOR OBS */
            background-color: transparent !important;
            overflow: hidden; /* Prevent scrollbars in OBS */
            font-family: var(--font-data);
        }

        /* --------------------------------------------------------------------------
           LAYOUT & CONTAINER
           -------------------------------------------------------------------------- */
        #overlay-container {
            display: flex;
            flex-direction: column;
            gap: 16px; /* Clearly separates each premium block */
            padding: 20px;
            width: 320px; /* Perfect width for a stream corner */
            position: absolute;
            top: 0;
            right: 0; /* Align to right by default, streamer can move in OBS */
        }

        /* --------------------------------------------------------------------------
           PREMIUM MODULAR BLOCKS (Glassmorphism)
           -------------------------------------------------------------------------- */
        .stat-block {
            position: relative;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            transition: var(--transition-smooth);
            overflow: hidden;
            transform: translateZ(0); /* Hardware acceleration */
        }

        /* Animated border gradient line */
        .stat-block::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #fff;
            transition: var(--transition-smooth);
            z-index: 2;
        }

        .stat-block:hover {
            background: var(--bg-glass-hover);
            transform: translateX(-5px);
        }

        /* --------------------------------------------------------------------------
           TYPOGRAPHY & GLOWS
           -------------------------------------------------------------------------- */
        .stat-label {
            font-family: var(--font-ui);
            font-size: 1.25rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-bottom: 2px;
            font-weight: 600;
            z-index: 2;
            position: relative;
        }

        .stat-value {
            font-family: var(--font-data);
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.1;
            letter-spacing: 1px;
            z-index: 2;
            position: relative;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            transition: var(--transition-smooth);
        }

        /* --- Individual Color Profiles --- */

        /* 1. Safe Points (Gold) */
        .block-safe { border-right: 1px solid rgba(255, 215, 0, 0.1); }
        .block-safe::before { background: var(--safe-gold); box-shadow: 0 0 15px var(--safe-gold); }
        .block-safe .stat-label { color: rgba(255, 215, 0, 0.8); }
        .block-safe .stat-value { 
            text-shadow: 0 0 10px var(--safe-gold-glow), 
                         0 0 20px var(--safe-gold-glow), 
                         0 0 40px rgba(255, 215, 0, 0.3); 
        }

        /* 2. Current Pot (Blood Red) */
        .block-pot { border-right: 1px solid rgba(255, 0, 60, 0.1); }
        .block-pot::before { background: var(--entity-blood); box-shadow: 0 0 15px var(--entity-blood); }
        .block-pot .stat-label { color: rgba(255, 0, 60, 0.8); }
        .block-pot .stat-value { 
            text-shadow: 0 0 10px var(--entity-blood-glow), 
                         0 0 25px var(--entity-blood-glow), 
                         0 0 45px rgba(255, 0, 60, 0.3); 
        }

        /* 3. Current Streak (Ethereal Blue) */
        .block-streak { border-right: 1px solid rgba(0, 240, 255, 0.1); }
        .block-streak::before { background: var(--ethereal-streak); box-shadow: 0 0 15px var(--ethereal-streak); }
        .block-streak .stat-label { color: rgba(0, 240, 255, 0.8); }
        .block-streak .stat-value { 
            text-shadow: 0 0 10px var(--ethereal-streak-glow), 
                         0 0 20px var(--ethereal-streak-glow); 
        }

        /* 4. Best Streak (Golden/White Hybrid) */
        .block-best { border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .block-best::before { background: #ffffff; box-shadow: 0 0 15px #ffffff; }
        .block-best .stat-label { color: rgba(255, 255, 255, 0.8); }
        .block-best .stat-value { 
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 
                         0 0 20px rgba(255,215,0,0.5); 
        }

        /* 5. Ransom Jail (Corrupted Purple) */
        .block-jail { border-right: 1px solid rgba(157, 0, 255, 0.1); }
        .block-jail::before { background: var(--jail-purple); box-shadow: 0 0 15px var(--jail-purple); }
        .block-jail .stat-label { color: rgba(157, 0, 255, 0.8); }
        .block-jail .stat-value { 
            text-shadow: 0 0 10px var(--jail-purple-glow), 
                         0 0 25px var(--jail-purple-glow); 
        }

        /* --------------------------------------------------------------------------
           DYNAMIC UPDATE ANIMATIONS
           -------------------------------------------------------------------------- */
        /* When a value changes, JS will apply this class to make it pop and glow intensely */
        .value-update-pulse {
            animation: textPulse 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes textPulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.15); filter: brightness(1.8); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* Background pulse effect for the container */
        .bg-update-flash {
            animation: bgFlash 0.8s ease-out;
        }

        @keyframes bgFlash {
            0% { background: var(--bg-glass); }
            30% { background: rgba(255, 255, 255, 0.15); }
            100% { background: var(--bg-glass); }
        }

        /* --------------------------------------------------------------------------
           CONNECTION STATUS UI
           -------------------------------------------------------------------------- */
        #connection-status {
            font-family: var(--font-ui);
            font-size: 1rem;
            color: var(--text-muted);
            text-align: right;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff0000;
            box-shadow: 0 0 8px #ff0000;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-dot.connected {
            background: #00ff66;
            box-shadow: 0 0 10px #00ff66;
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Subtext for context (e.g., multiplier display) */
        .stat-subtext {
            font-family: var(--font-ui);
            font-size: 1rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: -2px;
        }
    </style>
</head>
<body>

    <div id="overlay-container">
        
        <!-- Connection / Streamer Info -->
        <div id="connection-status">
            <span id="streamer-name-display">Connecting...</span>
            <div class="status-dot" id="dot-status"></div>
        </div>

        <!-- 1. Safe Points Block -->
        <div class="stat-block block-safe" id="box-safe">
            <div class="stat-label">Safe Bank</div>
            <div class="stat-value" id="val-safe">0</div>
        </div>

        <!-- 2. Current Pot Block -->
        <div class="stat-block block-pot" id="box-pot">
            <div class="stat-label">Active Pot</div>
            <div class="stat-value" id="val-pot">0</div>
            <div class="stat-subtext" id="sub-multiplier">Multiplier: 1.0x</div>
        </div>

        <!-- 3. Current Streak Block -->
        <div class="stat-block block-streak" id="box-streak">
            <div class="stat-label">Current Streak</div>
            <div class="stat-value" id="val-streak">0</div>
        </div>

        <!-- 4. Best Streak Block -->
        <div class="stat-block block-best" id="box-best">
            <div class="stat-label">Highest Streak</div>
            <div class="stat-value" id="val-best">0</div>
        </div>

        <!-- 5. Perks In Jail Block -->
        <div class="stat-block block-jail" id="box-jail">
            <div class="stat-label">Perks in Jail</div>
            <div class="stat-value" id="val-jail">0</div>
        </div>

    </div>

    <!-- ==========================================================================
         JAVASCRIPT / FIREBASE LOGIC
         ========================================================================== -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ----------------------------------------------------------------------
        // YOUR FIREBASE CONFIGURATION
        // (Paste your exact config here - same as your main website)
        // ----------------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ----------------------------------------------------------------------
        // GET STREAMER USERNAME FROM URL
        // Expected URL in OBS: https://yourdomain.com/overlay.html?user=StreamerName
        // ----------------------------------------------------------------------
        const urlParams = new URLSearchParams(window.location.search);
        const streamerUsername = urlParams.get('user');
        
        const statusText = document.getElementById('streamer-name-display');
        const statusDot = document.getElementById('dot-status');

        if (!streamerUsername) {
            statusText.innerText = "ERROR: No ?user= param";
            statusText.style.color = "var(--entity-blood)";
            console.error("Please add ?user=USERNAME to the Browser Source URL in OBS.");
        } else {
            statusText.innerText = `${streamerUsername.toUpperCase()} // LIVE`;
            
            // ----------------------------------------------------------------------
            // PREVIOUS STATE TRACKING (To trigger CSS animations only when numbers change)
            // ----------------------------------------------------------------------
            const previousState = {
                safeBank: null,
                currentPot: null,
                totalStreak: null,
                highestStreak: null,
                ransomJail: null
            };

            // ----------------------------------------------------------------------
            // UI UPDATE FUNCTION WITH ANIMATIONS
            // ----------------------------------------------------------------------
            function updateStatUI(elementId, boxId, newValue, stateKey, prefix = "", suffix = "") {
                const el = document.getElementById(elementId);
                const box = document.getElementById(boxId);
                
                // Only animate and update if the value actually changed
                if (previousState[stateKey] !== newValue) {
                    
                    // Update Text
                    el.innerText = `${prefix}${newValue.toLocaleString()}${suffix}`;
                    
                    // Trigger Pulse Animations by re-applying the class
                    el.classList.remove('value-update-pulse');
                    box.classList.remove('bg-update-flash');
                    
                    // Slight delay forces browser reflow to restart animation
                    void el.offsetWidth; 
                    
                    el.classList.add('value-update-pulse');
                    box.classList.add('bg-update-flash');
                    
                    // Save new state
                    previousState[stateKey] = newValue;
                }
            }

            // ----------------------------------------------------------------------
            // REAL-TIME DATABASE LISTENER
            // (Requires NO changes to database rules! Reads exactly what the webapp writes)
            // ----------------------------------------------------------------------
            const userRef = doc(db, 'roulette_state', streamerUsername);
            
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    // Connected successfully
                    statusDot.classList.add('connected');
                    
                    const data = docSnap.data();
                    
                    // Extract Data (Fallback to 0 if undefined)
                    const safeBank = data.safeBank || 0;
                    const currentPot = data.currentPot || 0;
                    const totalStreak = data.totalStreak || 0;
                    const highestStreak = data.highestStreak || 0;
                    
                    // Calculate multiplier for the subtext
                    const currentLocalStreak = data.currentLocalStreak || 0;
                    const multiplier = 1.0 + (currentLocalStreak * 0.5);
                    document.getElementById('sub-multiplier').innerText = `Multiplier: ${multiplier.toFixed(1)}x`;

                    // Jail array length calculation
                    const jailArray = data.ransomJail || [];
                    const perksInJail = jailArray.length;

                    // Update UI via our custom animated function
                    updateStatUI('val-safe', 'box-safe', safeBank, 'safeBank');
                    updateStatUI('val-pot', 'box-pot', currentPot, 'currentPot');
                    updateStatUI('val-streak', 'box-streak', totalStreak, 'totalStreak');
                    updateStatUI('val-best', 'box-best', highestStreak, 'highestStreak');
                    updateStatUI('val-jail', 'box-jail', perksInJail, 'ransomJail');

                } else {
                    // Document doesn't exist yet (Streamer hasn't played/saved yet)
                    statusText.innerText = "AWAITING ENTITY...";
                    statusDot.classList.remove('connected');
                }
            }, (error) => {
                // Connection Error Handling
                console.error("Firestore Listen Error:", error);
                statusText.innerText = "CONNECTION LOST";
                statusDot.classList.remove('connected');
            });
        }
    </script>
</body>
</html>
