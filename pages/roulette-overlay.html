<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity's Roulette Overlay - Performance Lite Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;0,900;1,900&family=Teko:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Solid Dark Backgrounds instead of expensive glass blurs */
            --bg-solid: rgba(12, 12, 16, 0.95);
            --bg-solid-light: rgba(22, 22, 30, 0.98);
            
            /* Hyper-Saturated Neon Palette */
            --gold-glow: #ffc400; --gold-dark: #997300;
            --blood-glow: #ff003c; --blood-dark: #8a0020;
            --ethereal-glow: #00f0ff; --ethereal-dark: #007a8a;
            --diamond-glow: #d4e8ff; --diamond-dark: #5a7399;
            --void-glow: #ae00ff; --void-dark: #5e008a;
            
            /* Exclusive Intro Magenta Palette */
            --intro-glow: red; --intro-dark: #7a0055;

            --font-ui: 'Teko', sans-serif;
            --font-data: 'Montserrat', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

        body, html {
            width: 100%; height: 100%;
            background-color: transparent !important; 
            overflow: hidden; 
            font-family: var(--font-data);
            -webkit-font-smoothing: antialiased;
        }

        /* ----- MAIN HUD WRAPPERS ----- */
        #perspective-wrapper {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
        }

        /* Container that swaps out via JS Loop */
        .view-container {
            position: absolute; top: 30px; right: 40px;
            width: 420px; 
            display: flex; flex-direction: column; gap: 26px;
            pointer-events: auto;
            /* REMOVED FILTER: BLUR for extreme performance gain */
            transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            will-change: opacity, transform;
        }

        .view-hidden {
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            pointer-events: none;
        }

        .view-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        /* ----- INTRO SHOWCASE SPECIFICS ----- */
        .intro-wrapper {
            position: relative; border-radius: 20px; padding: 6px; 
            background: rgba(0,0,0,0.9); overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.9); /* Simplified shadow */
            opacity: 0;
            animation: hudBootSequence 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        #wrap-intro { --theme-color: var(--intro-glow); --theme-dark: var(--intro-dark); }

        .intro-block {
            position: relative;
            background: linear-gradient(135deg, var(--bg-solid) 0%, rgba(30, 0, 20, 0.98) 100%);
            border-radius: 14px; padding: 55px 20px; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 2;
            /* REMOVED backdrop-filter entirely */
        }

        .intro-badge {
            font-family: var(--font-ui); font-size: 1.3rem; letter-spacing: 5px;
            color: #fff; background: rgba(0,0,0,0.8);
            padding: 6px 20px; border-radius: 4px; border: 1px solid var(--theme-color);
            margin-bottom: 25px; font-weight: 700; z-index: 4; position: relative;
        }

        .intro-title {
            font-family: var(--font-ui); font-size: 5.5rem; font-weight: 900;
            line-height: 0.9; color: #ffffff; -webkit-text-stroke: 2px #000000;
            /* Reduced shadow layers from 4 down to 2 */
            text-shadow: 0 0 15px var(--theme-color), 0 8px 10px rgba(0,0,0,0.9);
            margin-bottom: 15px; text-transform: uppercase; z-index: 4; position: relative;
        }

        .intro-subtitle {
            font-family: var(--font-data); font-size: 1.1rem; font-weight: 700;
            letter-spacing: 8px; color: #fff; text-transform: uppercase;
            z-index: 4; position: relative; text-shadow: 0 2px 4px rgba(0,0,0,1);
        }

        /* ----- PROGRESS GRID SPECIFICS ----- */
        .stat-block-wrapper {
            position: relative; border-radius: 20px; padding: 4px; /* Slightly thinner padding */
            background: rgba(0,0,0,0.9); overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.8);
            opacity: 0;
            /* REMOVED floating animation */
            animation: hudBootSequence 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        #wrap-safe   { animation-delay: 0.1s; --theme-color: var(--gold-glow); --theme-dark: var(--gold-dark); }
        #wrap-pot    { animation-delay: 0.2s; --theme-color: var(--blood-glow); --theme-dark: var(--blood-dark); }
        #wrap-streak { animation-delay: 0.3s; --theme-color: var(--ethereal-glow); --theme-dark: var(--ethereal-dark); }
        #wrap-best   { animation-delay: 0.4s; --theme-color: var(--diamond-glow); --theme-dark: var(--diamond-dark); }
        #wrap-jail   { animation-delay: 0.5s; --theme-color: var(--void-glow); --theme-dark: var(--void-dark); }

        @keyframes hudBootSequence {
            /* REMOVED blur from boot sequence */
            0% { opacity: 0; transform: translateX(50px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* Spinning border is hardware accelerated now */
        .spinning-border {
            position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(
                transparent 0deg, transparent 120deg, 
                var(--theme-dark) 220deg, var(--theme-color) 360deg
            );
            animation: spin 3s linear infinite; 
            z-index: 1;
            will-change: transform;
            transform: translateZ(0);
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Inner Panel uses solid background instead of blur */
        .stat-block {
            position: relative;
            background: linear-gradient(135deg, var(--bg-solid) 0%, var(--bg-solid-light) 100%);
            border-radius: 14px; padding: 14px 28px; 
            display: flex; flex-direction: column; justify-content: center;
            z-index: 2; overflow: hidden;
            /* Removed backdrop-filter and gloss sweeps */
        }

        .stat-label {
            font-family: var(--font-ui); font-size: 1.8rem; text-transform: uppercase; letter-spacing: 4px;
            margin-bottom: -12px; font-weight: 700; z-index: 4; position: relative;
            display: flex; justify-content: space-between; align-items: flex-end;
            color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,1);
        }
        .stat-label span { font-size: 1.35rem; opacity: 0.9; color: var(--theme-color); }

        .stat-value {
            font-family: var(--font-data); font-size: 5rem; font-weight: 900; font-style: italic; 
            line-height: 1.05; letter-spacing: 1px; z-index: 4; position: relative;
            color: #ffffff; -webkit-text-stroke: 2px #000000; 
            /* Simplified shadow */
            text-shadow: 0 0 15px var(--theme-color), 0 5px 10px rgba(0,0,0,0.8);
            transform-origin: left center;
        }

        .stat-subtext {
            font-family: var(--font-ui); font-size: 1.5rem; letter-spacing: 3px;
            margin-top: -4px; font-weight: 600; z-index: 4; position: relative; color: #ffffff;
        }

        .multi-high {
            color: #FFD700 !important;
            animation: dangerPulse 0.8s infinite alternate !important;
        }
        @keyframes dangerPulse {
            0% { text-shadow: 0 0 5px #ffaa00; transform: scale(1); }
            100% { text-shadow: 0 0 15px #ffaa00; transform: scale(1.05) translateX(5px); }
        }

        /* Simplified flash animation (no box-shadow spam) */
        .update-flash-container { animation: containerFlash 0.5s ease-out forwards; }
        @keyframes containerFlash {
            0% { background: var(--bg-solid); }
            20% { background: rgba(255,255,255,0.1); }
            100% { background: var(--bg-solid); }
        }

        /* Simplified text pop (No filter: drop-shadow spam) */
        .update-pop-text { animation: textPopHit 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes textPopHit {
            0% { transform: scale(1); }
            30% { transform: scale(1.15) rotate(-2deg); color: var(--theme-color); }
            100% { transform: scale(1) rotate(0deg); color: #ffffff; }
        }

        #connection-status {
            font-family: var(--font-ui); font-size: 1.8rem; color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,1);
            text-align: right; text-transform: uppercase; letter-spacing: 6px;
            display: flex; justify-content: flex-end; align-items: center; gap: 16px;
            padding-right: 5px; font-weight: 700;
        }

        .status-dot { width: 16px; height: 16px; border-radius: 50%; background: #ff003c; border: 2px solid #000; }
        .status-dot.connected { background: #00ff66; animation: statusBeat 1s infinite alternate; }
        @keyframes statusBeat { 0% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="perspective-wrapper">
        
        <!-- =================== INTRO SHOWCASE =================== -->
        <div id="intro-container" class="view-container view-hidden">
            <div class="intro-wrapper" id="wrap-intro">
                <div class="spinning-border"></div>
                <div class="intro-block">
                    <div class="intro-badge">CHALLENGE SHOWCASE</div>
                    <div class="intro-title">Entity's<br>Roulette</div>
                    <div class="intro-subtitle">Survive The Odds</div>
                </div>
            </div>
        </div>

        <!-- =================== PROGRESS GRIDS =================== -->
        <div id="progress-container" class="view-container view-hidden">
            
            <div id="connection-status">
                <span id="streamer-name-display">ESTABLISHING UPLINK...</span>
                <div class="status-dot" id="dot-status"></div>
            </div>

            <div class="stat-block-wrapper" id="wrap-safe">
                <div class="spinning-border"></div>
                <div class="stat-block" id="box-safe">
                    <div class="stat-label">Safe Bank <span>PTS</span></div>
                    <div class="stat-value" id="val-safe">0</div>
                </div>
            </div>

            <div class="stat-block-wrapper" id="wrap-pot">
                <div class="spinning-border"></div>
                <div class="stat-block" id="box-pot">
                    <div class="stat-label">Active Pot <span>RISK</span></div>
                    <div class="stat-value" id="val-pot">0</div>
                    <div class="stat-subtext" id="sub-multiplier">MULTI: 1.0x</div>
                </div>
            </div>

            <div class="stat-block-wrapper" id="wrap-streak">
                <div class="spinning-border"></div>
                <div class="stat-block" id="box-streak">
                    <div class="stat-label">Global Streak <span>WINS</span></div>
                    <div class="stat-value" id="val-streak">0</div>
                </div>
            </div>

            <div class="stat-block-wrapper" id="wrap-best">
                <div class="spinning-border"></div>
                <div class="stat-block" id="box-best">
                    <div class="stat-label">Highest Streak <span>RECORD</span></div>
                    <div class="stat-value" id="val-best">0</div>
                </div>
            </div>

            <div class="stat-block-wrapper" id="wrap-jail">
                <div class="spinning-border"></div>
                <div class="stat-block" id="box-jail">
                    <div class="stat-label">Perks in Jail <span>LOCKED</span></div>
                    <div class="stat-value" id="val-jail">0</div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const introView = document.getElementById('intro-container');
        const progressView = document.getElementById('progress-container');

        function executeDisplayLoop() {
            introView.classList.remove('view-hidden');
            introView.classList.add('view-active');
            
            progressView.classList.remove('view-active');
            progressView.classList.add('view-hidden');

            setTimeout(() => {
                introView.classList.remove('view-active');
                introView.classList.add('view-hidden');
                
                progressView.classList.remove('view-hidden');
                progressView.classList.add('view-active');

                setTimeout(executeDisplayLoop, 10000);

            }, 3000); 
        }

        executeDisplayLoop();

        const firebaseConfig = {
            // Your config here
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const streamerUsername = urlParams.get('user');
        
        const statusText = document.getElementById('streamer-name-display');
        const statusDot = document.getElementById('dot-status');

        if (!streamerUsername) {
            statusText.innerText = "NO TARGET ASSIGNED";
            statusText.style.color = "var(--blood-glow)";
        } else {
            statusText.innerText = `UPLINK: ${streamerUsername.toUpperCase()}`;
            
            // Highly optimized JS Roll (Removed text-shadow recalculations)
            function slotMachineRoll(obj, start, end, duration) {
                let startTimestamp = null;
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const easeOut = 1 - Math.pow(1 - progress, 4);
                    const current = Math.floor(start + (end - start) * easeOut);
                    
                    obj.innerText = current.toLocaleString();
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        obj.innerText = end.toLocaleString();
                    }
                };
                window.requestAnimationFrame(step);
            }

            const previousState = { safeBank: null, currentPot: null, totalStreak: null, highestStreak: null, ransomJail: null };

            function triggerPremiumUpdate(elementId, boxId, newValue, stateKey) {
                const el = document.getElementById(elementId);
                const box = document.getElementById(boxId);
                
                if (previousState[stateKey] !== newValue) {
                    const oldValue = previousState[stateKey] === null ? 0 : previousState[stateKey];
                    
                    el.classList.remove('update-pop-text');
                    box.classList.remove('update-flash-container');
                    void box.offsetWidth; 
                    
                    box.classList.add('update-flash-container');
                    el.classList.add('update-pop-text');
                    
                    slotMachineRoll(el, oldValue, newValue, 600);
                    previousState[stateKey] = newValue;
                }
            }

            const userRef = doc(db, 'roulette_state', streamerUsername);
            
            onSnapshot(userRef, (docSnap) => {
                if (docSnap.exists()) {
                    statusDot.classList.add('connected');
                    const data = docSnap.data();
                    
                    const multiplier = 1.0 + ((data.currentLocalStreak || 0) * 0.5);
                    const multiEl = document.getElementById('sub-multiplier');
                    multiEl.innerText = `MULTI: ${multiplier.toFixed(1)}x`;
                    
                    if (multiplier >= 2.0) { multiEl.classList.add('multi-high'); } 
                    else { multiEl.classList.remove('multi-high'); }

                    triggerPremiumUpdate('val-safe', 'box-safe', data.safeBank || 0, 'safeBank');
                    triggerPremiumUpdate('val-pot', 'box-pot', data.currentPot || 0, 'currentPot');
                    triggerPremiumUpdate('val-streak', 'box-streak', data.totalStreak || 0, 'totalStreak');
                    triggerPremiumUpdate('val-best', 'box-best', data.highestStreak || 0, 'highestStreak');
                    triggerPremiumUpdate('val-jail', 'box-jail', (data.ransomJail || []).length, 'ransomJail');

                } else {
                    statusText.innerText = "AWAITING TARGET DATA...";
                    statusDot.classList.remove('connected');
                }
            }, (error) => {
                statusText.innerText = "UPLINK SEVERED";
                statusDot.classList.remove('connected');
            });
        }
    </script>
</body>
</html>
