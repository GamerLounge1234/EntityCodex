<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entity Roulette Stream Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Teko:wght@600;700&display=swap');

        :root {
            --blood-red: #d32f2f;
            --arterial-spray: #ff1a1a;
            --deep-blood: #4a0000;
            --gold-ascension: #e5b824;
            --gold-glow: rgba(229, 184, 36, 0.45);
            --neon-red-glow: rgba(255, 26, 26, 0.5);
            --bg-glass: rgba(12, 8, 10, 0.78);
            --border-glass: rgba(211, 47, 47, 0.35);
            --text-light: #f5f5fa;
            --text-dim: #9e9ea8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 18px;
        }

        /* Master Container */
        .hud-wrapper {
            width: 340px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            user-select: none;
        }

        /* Top Header Badge */
        .hud-header {
            background: linear-gradient(90deg, rgba(20, 0, 0, 0.9) 0%, rgba(5, 5, 8, 0.7) 100%);
            border: 1px solid var(--border-glass);
            border-left: 4px solid var(--blood-red);
            border-radius: 6px;
            padding: 6px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .channel-tag {
            font-family: 'Teko', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background: var(--arterial-spray);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--arterial-spray);
            animation: radarPulse 1.8s infinite;
        }

        .playstyle-badge {
            font-family: 'Teko', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
            padding: 1px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* Primary Point Module */
        .points-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-tile {
            background: var(--bg-glass);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 12px;
            position: relative;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s ease;
        }

        .tile-safe {
            border-bottom: 2px solid var(--gold-ascension);
        }

        .tile-pot {
            border-bottom: 2px solid var(--blood-red);
        }

        .stat-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-number {
            font-family: 'Teko', sans-serif;
            font-size: 2.1rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 1px;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .stat-number.gold {
            color: var(--gold-ascension);
            text-shadow: 0 0 12px var(--gold-glow);
        }

        .stat-number.red {
            color: var(--arterial-spray);
            text-shadow: 0 0 12px var(--neon-red-glow);
        }

        .multiplier-tag {
            font-size: 0.75rem;
            color: #fff;
            background: var(--blood-red);
            padding: 1px 5px;
            border-radius: 3px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Streak & Ransom Bar */
        .bottom-hud {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 10px 14px;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65);
        }

        .streak-info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .streak-title {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
        }

        .streak-counter {
            font-family: 'Teko', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--gold-ascension);
            letter-spacing: 1px;
        }

        .streak-track {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
            position: relative;
        }

        .streak-progress {
            height: 100%;
            background: linear-gradient(90deg, #7a0000 0%, var(--gold-ascension) 100%);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 8px var(--gold-glow);
        }

        .status-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 6px;
        }

        .jail-counter {
            color: #ff5252;
            font-weight: 900;
        }

        /* Update Value Flash Animation */
        .value-flash {
            animation: valueFlash 0.6s ease-out;
        }

        @keyframes valueFlash {
            0% { transform: scale(1.15); filter: brightness(1.7); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        @keyframes radarPulse {
            0% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px var(--arterial-spray); }
            100% { transform: scale(0.9); opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="hud-wrapper">
        <!-- Top Title Bar -->
        <div class="hud-header">
            <div class="channel-tag">
                <div class="pulse-dot"></div>
                <span id="player-label">ROULETTE</span>
            </div>
            <div class="playstyle-badge" id="playstyle-label">SOLO</div>
        </div>

        <!-- Safe Points and Pot Grid -->
        <div class="points-grid">
            <div class="stat-tile tile-safe">
                <div class="stat-label">Safe Bank</div>
                <div class="stat-number gold" id="val-safe">0</div>
            </div>
            <div class="stat-tile tile-pot">
                <div class="stat-label">
                    <span>Active Pot</span>
                    <span class="multiplier-tag" id="val-multiplier">1.0x</span>
                </div>
                <div class="stat-number red" id="val-pot">0</div>
            </div>
        </div>

        <!-- Streak & Ransom Jail Bar -->
        <div class="bottom-hud">
            <div class="streak-info-row">
                <span class="streak-title">Universal Streak</span>
                <span class="streak-counter" id="val-streak">0 / 50</span>
            </div>
            <div class="streak-track">
                <div class="streak-progress" id="streak-bar"></div>
            </div>
            <div class="status-footer">
                <span>Ransom Jail:</span>
                <span class="jail-counter" id="val-jail">0 PERKS</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (Paste your actual config here)
        const firebaseConfig = {
            // YOUR_FIREBASE_CONFIG_KEYS
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Read streamer name from query parameters: ?user=Username
        const urlParams = new URLSearchParams(window.location.search);
        const targetUser = urlParams.get('user') || 'Unknown_Victim';

        document.getElementById('player-label').innerText = targetUser;

        // Flash helper
        function animateUpdate(elem, newVal) {
            if (elem.innerText !== String(newVal)) {
                elem.innerText = newVal;
                elem.classList.remove('value-flash');
                void elem.offsetWidth; // Trigger reflow
                elem.classList.add('value-flash');
            }
        }

        // Live Real-Time Document Listener
        onSnapshot(doc(db, 'roulette_state', targetUser), (docSnap) => {
            if (!docSnap.exists()) {
                console.warn("No roulette state document exists for user:", targetUser);
                return;
            }

            const data = docSnap.data();

            // 1. Safe Bank Points
            const safePoints = Number(data.safeBank || 0).toLocaleString();
            animateUpdate(document.getElementById('val-safe'), safePoints);

            // 2. Active Pot
            const currentPot = Number(data.currentPot || 0).toLocaleString();
            animateUpdate(document.getElementById('val-pot'), currentPot);

            // 3. Multiplier
            const streakCount = data.currentLocalStreak || 0;
            const mult = (1.0 + (streakCount * 0.5)).toFixed(1) + 'x';
            document.getElementById('val-multiplier').innerText = mult;

            // 4. Universal Streak & Progress Bar
            const totalStreak = data.totalStreak || 0;
            document.getElementById('val-streak').innerText = `${totalStreak} / 50`;
            const streakPct = Math.min(100, (totalStreak / 50) * 100);
            document.getElementById('streak-bar').style.width = `${streakPct}%`;

            // 5. Ransom Jail
            const jailedCount = (data.ransomJail || []).length;
            document.getElementById('val-jail').innerText = `${jailedCount} PERK${jailedCount === 1 ? '' : 'S'}`;

            // 6. Playstyle Detection
            let sizes = data.usedPartySizes || [];
            if (sizes.length === 0 && data.lockedPartySize) {
                sizes = [parseInt(data.lockedPartySize)];
            }

            const styleBadge = document.getElementById('playstyle-label');
            if (sizes.length > 1) {
                styleBadge.innerText = 'GENERIC';
                styleBadge.style.color = '#b8a5a5';
                styleBadge.style.borderColor = 'rgba(255, 255, 255, 0.2)';
            } else if (sizes.length === 1) {
                const s = sizes[0];
                if (s === 1) { styleBadge.innerText = 'SOLO'; styleBadge.style.color = '#00ff66'; styleBadge.style.borderColor = '#00ff66'; }
                else if (s === 2) { styleBadge.innerText = 'DUO'; styleBadge.style.color = '#00bfff'; styleBadge.style.borderColor = '#00bfff'; }
                else if (s === 3) { styleBadge.innerText = 'TRIO'; styleBadge.style.color = '#ff00ff'; styleBadge.style.borderColor = '#ff00ff'; }
                else if (s === 4) { styleBadge.innerText = 'SQUAD'; styleBadge.style.color = '#ff8c00'; styleBadge.style.borderColor = '#ff8c00'; }
            } else {
                styleBadge.innerText = 'STANDBY';
                styleBadge.style.color = 'var(--text-dim)';
            }
        });
    </script>
</body>
</html>
