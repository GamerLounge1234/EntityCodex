
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Overlay</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@700;900&family=Courier+New&display=swap');

        /* Transparent background for OBS */
        body {
            margin: 0; padding: 0; overflow: hidden;
            background: transparent; 
            font-family: 'Montserrat', sans-serif;
            color: #fff;
        }

        /* Compact, Premium Glassmorphism Container */
        .overlay-container {
            width: 320px;
            background: linear-gradient(135deg, rgba(15, 5, 5, 0.85) 0%, rgba(5, 5, 8, 0.95) 100%);
            border: 2px solid rgba(211, 47, 47, 0.6);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(211, 47, 47, 0.2);
            backdrop-filter: blur(8px);
        }

        .header {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            color: #d32f2f;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(211, 47, 47, 0.8);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #b8a5a5;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Courier New', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        /* Value specific coloring */
        .val-safe { color: #e5b824; text-shadow: 0 0 10px rgba(229, 184, 36, 0.5), 2px 2px 4px #000; }
        .val-pot { color: #fff; }
        .val-streak { color: #00ff66; text-shadow: 0 0 10px rgba(0, 255, 102, 0.5), 2px 2px 4px #000; }
        .val-jail { color: #ff5500; }

        /* Animation for active pot */
        .active-pot .stat-value {
            color: #d32f2f;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 5px rgba(211, 47, 47, 0.5), 2px 2px 4px #000; }
            to { text-shadow: 0 0 20px rgba(211, 47, 47, 1), 2px 2px 4px #000; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="overlay-container">
        <div class="header">Entity's Roulette</div>
        
        <div class="grid">
            <div class="stat-box">
                <span class="stat-label">Safe Bank</span>
                <span class="stat-value val-safe" id="ov-safe">0</span>
            </div>
            <div class="stat-box" id="pot-container">
                <span class="stat-label">Current Pot</span>
                <span class="stat-value val-pot" id="ov-pot">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Streak</span>
                <span class="stat-value val-streak" id="ov-streak">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Perks Jailed</span>
                <span class="stat-value val-jail" id="ov-jail">0</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. Paste your exact Firebase Config here
        const firebaseConfig = {
            // YOUR CONFIG HERE
            apiKey: "AIzaSyBMAxj2E3snmnOcQXIylkIIS1cTnuu0hlY",
            authDomain: "dashboard-1db87.firebaseapp.com",
            projectId: "dashboard-1db87",
            storageBucket: "dashboard-1db87.firebasestorage.app",
            messagingSenderId: "711217707380",
            appId: "1:711217707380:web:247cfdfb2dc3c2c4485421",
            measurementId: "G-Z4WBDQ9HEH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. Get the target username from the URL (e.g. ?user=StreamerName)
        const urlParams = new URLSearchParams(window.location.search);
        const streamerName = urlParams.get('user');

        if (!streamerName) {
            document.querySelector('.header').innerText = "ERROR";
            document.querySelector('.header').style.fontSize = "1rem";
            document.querySelector('.header').innerText = "Add ?user=USERNAME to Browser Source URL";
        } else {
            // 3. Real-time Listener (onSnapshot instead of getDoc)
            const docRef = doc(db, 'roulette_state', streamerName);
            
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    document.getElementById('ov-safe').innerText = data.safeBank || 0;
                    document.getElementById('ov-pot').innerText = data.currentPot || 0;
                    document.getElementById('ov-streak').innerText = data.totalStreak || 0;
                    document.getElementById('ov-jail').innerText = (data.ransomJail || []).length;

                    // Animate the Pot if they are Doubling Down
                    const potContainer = document.getElementById('pot-container');
                    if ((data.currentPot || 0) > 0) {
                        potContainer.classList.add('active-pot');
                    } else {
                        potContainer.classList.remove('active-pot');
                    }
                }
            });
        }
    </script>
</body>
</html>
